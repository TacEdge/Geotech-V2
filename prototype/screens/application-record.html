<!DOCTYPE html>
<html lang="en-NZ">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TacEdge Ground Engineering · Application Record</title>
  <link rel="stylesheet" href="../styles/fonts.css">
  <link rel="stylesheet" href="../styles/tokens.css">
  <link rel="stylesheet" href="../styles/base.css">
  <link rel="stylesheet" href="../styles/components.css">
<link rel="stylesheet" href="../styles/capture.css">
<style>
.card .clab{font-family:var(--mono);font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-40);margin-bottom:12px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.card .clab .tp{margin-left:auto;text-transform:none;letter-spacing:0;font-family:var(--ui);font-size:11.5px;font-weight:600;color:var(--forest-2);background:var(--sage-tint);border-radius:var(--r-pill);padding:3px 10px}
.idrow{display:flex;align-items:flex-end;justify-content:space-between;gap:14px}
.idrow .pid{font-family:var(--mono);font-size:32px;font-weight:700;color:var(--forest);line-height:1}
.idrow .pst{font-family:var(--mono);font-size:11px;font-weight:600;color:var(--forest-2);background:var(--sage-tint);border-radius:var(--r-pill);padding:5px 11px}
.meta{display:grid;grid-template-columns:1fr 1fr;gap:10px 14px;margin-top:16px}
.meta .m .k{font-size:11px;color:var(--ink-40)}
.meta .m .v{font-family:var(--mono);font-size:14px;font-weight:600;color:var(--ink);margin-top:2px}
table.dk{width:100%;border-collapse:collapse}
table.dk th{font-family:var(--mono);font-size:10px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-40);text-align:right;font-weight:600;padding:8px 6px;border-bottom:1px solid var(--line)}
table.dk th:first-child{text-align:left}
table.dk td{font-family:var(--mono);font-size:14px;color:var(--ink);text-align:right;padding:10px 6px;border-bottom:1px solid var(--line)}
table.dk td:first-child{text-align:left;color:var(--ink-60)}
table.dk tr:last-child td{border-bottom:none}
.dk-sum{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;margin-top:14px}
.dk-sum .s{background:var(--plan);border:1px solid var(--line);border-radius:var(--r-md);padding:12px}
.dk-sum .s .k{font-size:11px;color:var(--ink-40)}
.dk-sum .s .v{font-family:var(--mono);font-size:18px;font-weight:700;color:var(--ink);margin-top:5px}
.dk-sum .s .v.ok{color:var(--forest-2)}
.noz{display:flex;align-items:center;gap:13px}
.noz .ni{width:38px;height:38px;border-radius:9px;background:var(--sage-tint);color:var(--forest);display:grid;place-items:center;flex-shrink:0}
.noz .ni svg{width:20px;height:20px}
.noz .nx{flex:1}
.noz .n1{font-size:14.5px;font-weight:700;color:var(--ink)}
.noz .n2{font-family:var(--mono);font-size:12px;color:var(--ink-60);margin-top:2px}
</style>
<link rel="manifest" href="../manifest.json">
<meta name="theme-color" content="#112411">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="TacEdge">
<link rel="apple-touch-icon" href="../assets/icons/apple-touch-icon.png?v=2026-07-16.1-06-26.7">
  <script src="../config/screens.js"></script>
  <script src="../components/header.js"></script>
</head>
<body class="field">
  <header></header>
  <script>TE_HEADER.fill('application-record')</script>

  <div class="signed">
    <span class="tick"><svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6L9 17l-5-5"/></svg></span>
    <span>Signed on <b>06:48</b> &middot; cleared to spray</span><span class="jsa">JSA-402 ACK</span>
  </div>

  <main class="wrap">
    <div class="phead">
      <h1>Application Record</h1>
      <div class="psub" id="psub">Spray shift</div>
    </div>

    <div class="pilesel" id="pilesel"></div>

    <div class="card">
      <div class="idrow">
        <div class="pid" id="pid">—</div>
        <div class="pst" id="pst">—</div>
      </div>
      <div class="meta" id="meta"></div>
    </div>

    <div class="card">
      <div class="clab">Batch dockets <span class="tp" id="tpChip">—</span></div>
      <table class="dk">
        <thead><tr><th>Docket</th><th>Mix</th><th>m³</th></tr></thead>
        <tbody id="dkBody"></tbody>
      </table>
      <div class="dk-sum" id="dkSum"></div>
    </div>

    <div class="card">
      <div class="clab">Nozzleman</div>
      <div class="noz" id="noz"></div>
    </div>
  </main>

  <div class="dock">
    <button class="btn" id="submitQA">
      <svg class="bico" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round"><path d="M22 2L11 13M22 2l-7 20-4-9-9-4 20-7z"/></svg>
      <span class="bt"><span class="bt1" id="dockT">Submit for QA</span><span class="bt2" id="dockS">Dockets, nozzleman and test panel recorded</span></span>
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18l6-6-6-6"/></svg>
    </button>
  </div>

  <script type="module">
  import { packFor } from '../data/mock/index.js';
  import { renderSelector } from '../components/selector.js';
  function esc(s){return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
  var CHK='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6L9 17l-5-5"/></svg>';
  var pack = packFor('shotcrete');
  var ago = pack && pack.agoPhrase ? pack.agoPhrase : function(n){ return n + ' days ago'; };
  if (pack && pack.applicationRecords && pack.applicationRecords.length) {
    var recs = pack.applicationRecords;
    var noz = {}; (pack.nozzlemen || []).forEach(function(n){ noz[n.name] = n; });
    function render(idx){
      var r = recs[idx];
      document.getElementById('psub').textContent = 'Spray shift · ' + r.zone;
      document.getElementById('pid').textContent = r.lot;
      document.getElementById('pst').textContent = 'Sprayed ' + ago(r.sprayedDaysAgo);
      document.getElementById('meta').innerHTML =
        '<div class="m"><div class="k">Layers</div><div class="v">' + esc(r.layers) + '</div></div>' +
        '<div class="m"><div class="k">Weather</div><div class="v">' + esc(r.weather) + '</div></div>' +
        '<div class="m"><div class="k">Area covered</div><div class="v">' + esc(r.areaCovered) + '</div></div>' +
        '<div class="m"><div class="k">Test panel</div><div class="v">' + esc(r.testPanel) + '</div></div>';
      document.getElementById('tpChip').textContent = 'Test panel ' + r.testPanel;
      document.getElementById('dkBody').innerHTML = r.dockets.map(function(d){
        return '<tr><td>' + esc(d.no) + '</td><td>' + esc(d.mix) + '</td><td>' + d.m3.toFixed(1) + '</td></tr>';
      }).join('');
      var variance = Math.round((r.delivered_m3 / r.theoretical_m3) * 100);
      document.getElementById('dkSum').innerHTML =
        '<div class="s"><div class="k">Delivered</div><div class="v">' + r.delivered_m3.toFixed(1) + ' m³</div></div>' +
        '<div class="s"><div class="k">Theoretical</div><div class="v">' + r.theoretical_m3.toFixed(1) + ' m³</div></div>' +
        '<div class="s"><div class="k">Vs allowance</div><div class="v ok">×' + (r.delivered_m3 / r.theoretical_m3).toFixed(2) + '</div></div>';
      var n = noz[r.nozzleman] || { name: r.nozzleman, ticket: '—', expiry: '' };
      document.getElementById('noz').innerHTML =
        '<span class="ni"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="3.4"/><path d="M5.5 20a6.5 6.5 0 0 1 13 0"/></svg></span>' +
        '<span class="nx"><span class="n1">' + esc(n.name) + '</span><span class="n2">' + esc(n.ticket) + ' · ' + esc(n.expiry) + '</span></span>';
      document.querySelectorAll('.pilesel .ps').forEach(function(el, i){ el.classList.toggle('sel', i === idx); });
    }
    renderSelector(document.getElementById('pilesel'), recs.map(function(r){
      return { primary: r.lot, secondary: r.zone };
    }), { onSelect: render });
    render(0);
    var dock = document.getElementById('submitQA');
    dock.addEventListener('click', function(){
      dock.classList.add('done');
      document.getElementById('dockT').textContent = 'Submitted for QA';
      document.getElementById('dockS').textContent = 'Thickness check follows once cured';
      document.querySelector('.dock .bico').innerHTML = CHK;
    });
  }
  </script>

  <script defer src="../js/build.js"></script>
  <script defer src="../js/versioner.js"></script>
  <script defer src="../js/standalone.js"></script>
</body>
</html>
