<!DOCTYPE html>
<html lang="en-NZ">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TacEdge Geotech · Pull Test Record</title>
  <link rel="stylesheet" href="../styles/fonts.css">
  <link rel="stylesheet" href="../styles/tokens.css">
  <link rel="stylesheet" href="../styles/base.css">
  <link rel="stylesheet" href="../styles/components.css">
<link rel="stylesheet" href="../styles/capture.css">
<style>
.pilesel .ps.fail .pn{color:var(--brick)}

.pilesel .ps.sel.fail{border-color:var(--brick);background:var(--brick-tint)}

.card .clab{font-family:var(--mono);font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-40);margin-bottom:12px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}

.card .clab .thr{margin-left:auto;text-transform:none;letter-spacing:0;font-family:var(--ui);font-size:11.5px;font-weight:600;color:var(--forest-2);background:var(--sage-tint);border-radius:var(--r-pill);padding:3px 10px}

.idrow{display:flex;align-items:flex-end;justify-content:space-between;gap:14px}

.idrow .pid{font-family:var(--mono);font-size:32px;font-weight:700;color:var(--forest);line-height:1}

.idrow .pst{font-family:var(--mono);font-size:11px;font-weight:600;color:var(--forest-2);background:var(--sage-tint);border-radius:var(--r-pill);padding:5px 11px}

.idrow .pst.fail{color:var(--brick);background:var(--brick-tint)}

.load{display:flex;align-items:flex-end;gap:12px;margin-top:2px}

.load .big{font-family:var(--mono);font-size:44px;font-weight:700;line-height:1;color:var(--forest)}

.load .big.fail{color:var(--brick)}

.load .u{font-family:var(--mono);font-size:15px;color:var(--ink-40);margin-bottom:6px}

.load .tgt{margin-left:auto;text-align:right;font-size:12px;color:var(--ink-40)}

.load .tgt b{display:block;font-family:var(--mono);font-size:16px;color:var(--ink);font-weight:700;margin-top:2px}

.meta{display:grid;grid-template-columns:1fr 1fr;gap:10px 14px;margin-top:16px}

.meta .m .k{font-size:11px;color:var(--ink-40)}

.meta .m .v{font-family:var(--mono);font-size:14px;font-weight:600;color:var(--ink);margin-top:2px}

.note{display:flex;align-items:flex-start;gap:10px;background:var(--brick-tint);border:1px solid #e6c2ba;border-radius:var(--r-md);padding:12px 14px;margin-top:14px;font-size:13px;color:var(--ink)}

.note .ni{width:20px;height:20px;flex-shrink:0;color:var(--brick);margin-top:1px}

.note b{color:var(--brick)}

.rules{list-style:none;display:flex;flex-direction:column;gap:9px}

.rules li{display:flex;align-items:flex-start;gap:10px;font-size:13.5px;color:var(--ink)}

.rules li .rc{width:18px;height:18px;border-radius:50%;background:var(--sage-tint);color:var(--forest);display:grid;place-items:center;flex-shrink:0;margin-top:1px}

.rules li .rc svg{width:11px;height:11px}

.dock .btn.reopen{background:var(--brick)}

.dock .btn.reopen:hover{filter:brightness(1.05)}
</style>
<link rel="manifest" href="../manifest.json">
<meta name="theme-color" content="#2b4721">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="TacEdge">
<link rel="apple-touch-icon" href="../assets/icons/apple-touch-icon.png?v=2026-06-26.7">
  <script src="../config/screens.js"></script>
  <script src="../components/header.js"></script>
</head>
<body class="field">
  <header></header>
  <script>TE_HEADER.fill('pull-test')</script>

  <div class="signed">
    <span class="tick"><svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6L9 17l-5-5"/></svg></span>
    <span>Signed on <b>07:04</b> &middot; cleared to test</span><span class="jsa">JSA-311 ACK</span>
  </div>

  <main class="wrap">
    <div class="phead">
      <h1>Pull Test Record</h1>
      <div class="psub" id="psub">Crest pin proof test</div>
    </div>

    <div class="pilesel" id="pilesel"></div>

    <div class="card">
      <div class="idrow">
        <div class="pid" id="pid">—</div>
        <div class="pst" id="pst">—</div>
      </div>
      <div class="load">
        <span class="big" id="loadBig">—</span><span class="u">kN held</span>
        <span class="tgt">Target proof<b id="loadTgt">—</b></span>
      </div>
      <div class="meta" id="meta"></div>
    </div>

    <div id="noteWrap"></div>

    <div class="card">
      <div class="clab">Acceptance criteria</div>
      <ul class="rules" id="rules"></ul>
    </div>
  </main>

  <div class="dock">
    <button class="btn" id="submitQA">
      <svg class="bico" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round"><path d="M22 2L11 13M22 2l-7 20-4-9-9-4 20-7z"/></svg>
      <span class="bt"><span class="bt1" id="dockT">Submit for QA</span><span class="bt2" id="dockS">Proof load and hold recorded</span></span>
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18l6-6-6-6"/></svg>
    </button>
  </div>

  <script type="module">
  import { packFor } from '../data/mock/index.js';
  import { WORK_TYPES } from '../config/workTypes.js';
  import { renderSelector } from '../components/selector.js';
  function esc(s){return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
  var CHK='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6L9 17l-5-5"/></svg>';
  var WARN='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 4l9 16H3z"/><path d="M12 10v4"/><path d="M12 17.4v.01"/></svg>';
  var pack = packFor('rockfall');
  var wt = WORK_TYPES.rockfall;
  var cp1 = (wt.workItemTemplates || []).filter(function(t){return t.code==='CP1';})[0] || { rules: [] };
  if (pack && pack.pullTests && pack.pullTests.length) {
    var recs = pack.pullTests;
    var pullRule = (cp1.rules || []).filter(function(r){return r.field==='pull_load_kN';})[0] || { value: 50, unit: 'kN' };
    document.getElementById('loadTgt').textContent = '≥ ' + pullRule.value + ' ' + pullRule.unit;
    document.getElementById('rules').innerHTML = cp1.rules.map(function(r){
      return '<li><span class="rc">' + CHK + '</span><span>' + esc(r.label) + '</span></li>';
    }).join('');

    function render(idx){
      var r = recs[idx];
      var fail = r.result !== 'Pass';
      document.getElementById('pid').textContent = r.pin;
      var st = document.getElementById('pst');
      st.textContent = r.state === 'reopened' ? 'Reopened' : (r.state === 'confirmed' ? 'Confirmed' : 'Submitted');
      st.className = 'pst' + (fail ? ' fail' : '');
      var big = document.getElementById('loadBig');
      big.textContent = r.held_kN;
      big.className = 'big' + (fail ? ' fail' : '');
      document.getElementById('meta').innerHTML =
        '<div class="m"><div class="k">Hold time</div><div class="v">' + r.hold_min + ' min</div></div>' +
        '<div class="m"><div class="k">Creep / displacement</div><div class="v">' + esc(r.creep) + '</div></div>' +
        '<div class="m"><div class="k">Result</div><div class="v">' + esc(r.result) + '</div></div>' +
        '<div class="m"><div class="k">Tested by</div><div class="v">' + esc(r.by) + '</div></div>';
      document.getElementById('noteWrap').innerHTML = r.note
        ? '<div class="note"><span class="ni">' + WARN + '</span><span><b>Failed proof · reopened.</b> ' + esc(r.note) + '.</span></div>'
        : '';
      var dock = document.getElementById('submitQA');
      dock.classList.toggle('reopen', fail);
      document.getElementById('dockT').textContent = fail ? 'Flag for re-work' : 'Submit for QA';
      document.getElementById('dockS').textContent = fail ? 'Below proof load · re-drill and re-grout' : 'Proof load and hold recorded';
      document.querySelectorAll('.pilesel .ps').forEach(function(el, i){ el.classList.toggle('sel', i === idx); });
    }

    renderSelector(document.getElementById('pilesel'), recs.map(function(r){
      return { primary: r.pin, secondary: r.held_kN + ' kN', cls: r.result !== 'Pass' ? 'fail' : null };
    }), { onSelect: render });
    render(0);

    var dock = document.getElementById('submitQA');
    dock.addEventListener('click', function(){
      dock.classList.add('done'); dock.classList.remove('reopen');
      document.getElementById('dockT').textContent = 'Sent to QA queue';
      document.getElementById('dockS').textContent = 'PM will confirm or hold against the acceptance criteria';
      document.querySelector('.dock .bico').innerHTML = CHK;
    });
  }
  </script>

  <script defer src="../js/build.js"></script>
  <script defer src="../js/versioner.js"></script>
  <script defer src="../js/standalone.js"></script>
</body>
</html>
