<!DOCTYPE html>
<html lang="en-NZ">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TacEdge Ground Engineering · Sample Register</title>
  <link rel="stylesheet" href="../styles/fonts.css">
  <link rel="stylesheet" href="../styles/tokens.css">
  <link rel="stylesheet" href="../styles/base.css">
  <link rel="stylesheet" href="../styles/components.css">
<link rel="stylesheet" href="../styles/capture.css">
<style>
.card .clab{font-family:var(--mono);font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-40);margin-bottom:8px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.card .clab .st{margin-left:auto;text-transform:none;letter-spacing:0;font-family:var(--ui);font-size:11.5px;font-weight:600;color:var(--forest-2);background:var(--sage-tint);border-radius:var(--r-pill);padding:3px 10px}
.card .clab .st.plan{color:var(--ink-40);background:var(--plan)}
table.sr{width:100%;border-collapse:collapse}
table.sr th{font-family:var(--mono);font-size:9.5px;letter-spacing:.04em;text-transform:uppercase;color:var(--ink-40);text-align:left;font-weight:600;padding:6px 5px;border-bottom:1px solid var(--line-2)}
table.sr th.n{text-align:right}
table.sr td{padding:10px 5px;border-bottom:1px solid var(--line);font-size:12.5px;vertical-align:middle}
table.sr td.n{text-align:right;font-family:var(--mono);white-space:nowrap}
table.sr td.id{font-family:var(--mono);font-weight:600;color:var(--forest-2)}
table.sr tr:last-child td{border-bottom:none}
.ty{display:inline-block;font-family:var(--mono);font-size:10.5px;font-weight:600;letter-spacing:.04em;padding:2px 7px;border-radius:var(--r-pill);background:var(--plan);color:var(--ink-60);border:1px solid var(--line)}
.cust{display:inline-flex;align-items:center;gap:5px;font-family:var(--ui);font-size:11px;font-weight:700;padding:3px 9px;border-radius:var(--r-pill);color:var(--forest-2);background:var(--sage-tint)}
.cust .d{width:6px;height:6px;border-radius:50%;background:var(--forest-2)}
.dk{font-family:var(--mono);font-size:11.5px;color:var(--ink-60);margin-top:3px}
.empty{padding:18px 2px;text-align:center;color:var(--ink-40);font-size:13px}
</style>
<link rel="manifest" href="../manifest.json">
<meta name="theme-color" content="#2b4721">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="TacEdge">
<link rel="apple-touch-icon" href="../assets/icons/apple-touch-icon.png?v=2026-06-26.7">
  <script src="../config/screens.js"></script>
  <script src="../components/header.js"></script>
</head>
<body class="field">
  <header></header>
  <script>TE_HEADER.fill('sample-register')</script>

  <div class="signed">
    <span class="tick"><svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6L9 17l-5-5"/></svg></span>
    <span>Signed on <b>06:40</b> &middot; sample custody</span><span class="jsa">JSA-511 ACK</span>
  </div>

  <main class="wrap">
    <div class="phead">
      <h1>Sample Register</h1>
      <div class="psub" id="psub">Depth · type · custody</div>
    </div>

    <div class="pilesel" id="pilesel"></div>

    <div class="card">
      <div class="clab">Samples <span class="st" id="cnt">—</span></div>
      <table class="sr">
        <thead><tr><th>Depth m</th><th>Type</th><th>Sample</th><th>Custody</th></tr></thead>
        <tbody id="body"></tbody>
      </table>
    </div>
  </main>

  <div class="dock">
    <button class="btn" id="submitQA">
      <svg class="bico" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round"><path d="M22 2L11 13M22 2l-7 20-4-9-9-4 20-7z"/></svg>
      <span class="bt"><span class="bt1" id="dockT">Record dispatch</span><span class="bt2" id="dockS">Docket and date per sample</span></span>
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18l6-6-6-6"/></svg>
    </button>
  </div>

  <script type="module">
  import { packFor } from '../data/mock/index.js';
  import { renderSelector } from '../components/selector.js';
  function esc(s){return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
  var CHK='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6L9 17l-5-5"/></svg>';
  var pack = packFor('drilling');
  var ago = pack && pack.agoPhrase ? pack.agoPhrase : function(n){ return n + ' days ago'; };
  if (pack && pack.holes && pack.holes.length) {
    var holes = pack.holes;
    function render(idx){
      var h = holes[idx];
      document.getElementById('psub').textContent = 'Depth · type · custody · ' + h.id;
      var samples = h.samples || [];
      var cnt = document.getElementById('cnt');
      if (samples.length){ cnt.textContent = samples.length + ' dispatched'; cnt.className = 'st'; }
      else { cnt.textContent = 'None'; cnt.className = 'st plan'; }
      document.getElementById('body').innerHTML = samples.length
        ? samples.map(function(s){
            return '<tr>' +
              '<td class="n">' + s.depth.toFixed(1) + '</td>' +
              '<td><span class="ty">' + esc(s.type) + '</span></td>' +
              '<td class="id">' + esc(s.sample_id) + '<div class="dk">' + esc(s.dispatch_docket) + ' &middot; ' + esc(ago(s.dispatchedDaysAgo)) + '</div></td>' +
              '<td><span class="cust"><span class="d"></span>Dispatched</span></td>' +
            '</tr>';
          }).join('')
        : '<tr><td colspan="4"><div class="empty">No samples dispatched yet for ' + esc(h.id) + '.</div></td></tr>';
      document.querySelectorAll('.pilesel .ps').forEach(function(el, i){ el.classList.toggle('sel', i === idx); });
    }
    renderSelector(document.getElementById('pilesel'), holes.map(function(h){
      return { primary: h.id, secondary: h.zone };
    }), { onSelect: render });
    render(0);
    var dock = document.getElementById('submitQA');
    dock.addEventListener('click', function(){
      dock.classList.add('done');
      document.getElementById('dockT').textContent = 'Dispatch recorded';
      document.getElementById('dockS').textContent = 'Custody chain on file';
      document.querySelector('.dock .bico').innerHTML = CHK;
    });
  }
  </script>

  <script defer src="../js/build.js"></script>
  <script defer src="../js/versioner.js"></script>
  <script defer src="../js/standalone.js"></script>
</body>
</html>
