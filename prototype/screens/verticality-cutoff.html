<!DOCTYPE html>
<html lang="en-NZ">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TacEdge Geotech · Verticality &amp; Cut-off</title>
  <link rel="stylesheet" href="../styles/fonts.css">
  <link rel="stylesheet" href="../styles/tokens.css">
  <link rel="stylesheet" href="../styles/base.css">
  <link rel="stylesheet" href="../styles/components.css">
<style>

*{box-sizing:border-box;margin:0;padding:0}
body{font-family:var(--ui);color:var(--ink);background:var(--cream);min-height:100vh;-webkit-font-smoothing:antialiased}

.wrap{max-width:560px;margin:0 auto;padding:16px 16px 40px}
.phead h1{font-size:22px;font-weight:700;color:var(--ink);line-height:1.15}
.phead .psub{font-size:13px;color:var(--ink-60);margin-top:4px}

.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r-lg);box-shadow:var(--shadow-sm);padding:16px;margin-top:14px}
.card .clab{font-family:var(--mono);font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-40);margin-bottom:12px;display:flex;align-items:center;gap:8px}
.card .clab .tol{margin-left:auto;text-transform:none;letter-spacing:0;font-family:var(--ui);font-size:11.5px;font-weight:600;color:var(--ink-40)}

.idrow{display:flex;align-items:flex-end;justify-content:space-between;gap:14px}
.idrow .pid{font-family:var(--mono);font-size:32px;font-weight:700;color:var(--forest);line-height:1}
.idrow .pz{font-size:12px;color:var(--ink-40);margin-top:4px}
.idrow .pass{display:inline-flex;align-items:center;gap:6px;font-family:var(--ui);font-size:12px;font-weight:700;color:var(--forest-2);background:var(--sage-tint);border-radius:var(--r-pill);padding:6px 12px}
.idrow .pass svg{width:13px;height:13px}

.axes{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px}
.axes .ax{background:var(--plan);border:1px solid var(--line);border-radius:var(--r-md);padding:12px;text-align:center}
.axes .ax .k{font-size:11px;color:var(--ink-40)}
.axes .ax .v{font-family:var(--mono);font-size:20px;font-weight:700;color:var(--ink);margin-top:5px}
.axes .ax.res .v{color:var(--forest-2)}

.line{display:flex;align-items:center;justify-content:space-between;gap:14px;padding:11px 0;border-top:1px solid var(--line)}
.line:first-child{border-top:none}
.line .k{font-size:13px;color:var(--ink-60)}
.line .v{font-family:var(--mono);font-size:14px;font-weight:600;color:var(--ink);text-align:right}
.line .v.ok{color:var(--forest-2)}

.note{display:flex;align-items:flex-start;gap:9px;font-size:12.5px;color:var(--ink-60);line-height:1.5;margin-top:4px}
.note svg{width:15px;height:15px;color:var(--ink-40);flex-shrink:0;margin-top:2px}

.photos{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.ph{aspect-ratio:4/3;border:1.5px dashed var(--line-2);border-radius:var(--r-md);background:var(--plan);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:7px;color:var(--ink-40)}
.ph svg{width:24px;height:24px}
.ph span{font-size:11.5px;font-weight:600}
</style>
<link rel="manifest" href="../manifest.json">
<meta name="theme-color" content="#2b4721">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="TacEdge">
<link rel="apple-touch-icon" href="../assets/icons/apple-touch-icon.png?v=2026-06-26.7">
  <script src="../config/screens.js"></script>
  <script src="../components/header.js"></script>
</head>
<body class="field">
  <header></header>
  <script>TE_HEADER.fill('verticality-cutoff')</script>

  <main class="wrap">
    <div class="phead">
      <h1>Verticality &amp; Cut-off</h1>
      <div class="psub" id="psub">Screw pile · two-axis check and cut-off record</div>
    </div>

    <div class="card">
      <div class="idrow">
        <div><div class="pid" id="pid">—</div><div class="pz" id="pz"></div></div>
        <span class="pass" id="pass"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6L9 17l-5-5"/></svg> Within tolerance</span>
      </div>
    </div>

    <div class="card">
      <div class="clab">Verticality <span class="tol" id="vtol"></span></div>
      <div class="axes">
        <div class="ax"><div class="k">Axis X</div><div class="v" id="ax">—</div></div>
        <div class="ax"><div class="k">Axis Y</div><div class="v" id="ay">—</div></div>
        <div class="ax res"><div class="k">Resultant</div><div class="v" id="ares">—</div></div>
      </div>
    </div>

    <div class="card">
      <div class="clab">Cut-off &amp; cap</div>
      <div class="line"><span class="k">Cut-off level</span><span class="v ok" id="cut">—</span></div>
      <div class="line"><span class="k">Tolerance</span><span class="v" id="ctol">—</span></div>
      <div class="line"><span class="k">Cap detail</span><span class="v" id="cap">—</span></div>
      <div class="line"><span class="k">Recorded by</span><span class="v" id="by">—</span></div>
    </div>

    <div class="card">
      <div class="clab">Photos</div>
      <div class="photos">
        <div class="ph"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="6" width="18" height="14" rx="2"/><circle cx="12" cy="13" r="3.5"/><path d="M8 6l1.5-2h5L16 6"/></svg><span>Cut-off level</span></div>
        <div class="ph"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="6" width="18" height="14" rx="2"/><circle cx="12" cy="13" r="3.5"/><path d="M8 6l1.5-2h5L16 6"/></svg><span>Cap plate</span></div>
      </div>
    </div>

    <div class="card">
      <div class="note"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 8v.01M11 12h1v4h1"/></svg><span id="note"></span></div>
    </div>
  </main>

  <script type="module">
  import { packFor } from '../data/mock/index.js';
  import { WORK_TYPES } from '../config/workTypes.js';
  function set(id, v){ var e = document.getElementById(id); if (e) e.textContent = v; }
  var pack = packFor('piling');
  var wt = WORK_TYPES.piling;
  if (pack && pack.verticalityRecords && pack.verticalityRecords.length) {
    var r = pack.verticalityRecords[0];
    var vRule = (wt.rules || []).filter(function(x){return x.field==='verticality';})[0];
    set('vtol', vRule ? vRule.label : ('Tolerance ' + r.tolerance));
    set('pid', r.pile); set('pz', r.zone);
    set('ax', r.axisX); set('ay', r.axisY); set('ares', r.resultant);
    set('cut', r.cutoffLevel); set('ctol', r.cutoffTolerance); set('cap', r.cap); set('by', r.by + ' · ' + r.date);
    set('note', r.note);
  }
  </script>

  <script defer src="../js/build.js"></script>
  <script defer src="../js/versioner.js"></script>
  <script defer src="../js/standalone.js"></script>
</body>
</html>
