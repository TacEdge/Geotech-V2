<!DOCTYPE html>
<html lang="en-NZ">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TACEDGE Ground Engineering · Backfill Inspection</title>
  <link rel="stylesheet" href="../styles/fonts.css">
  <link rel="stylesheet" href="../styles/tokens.css">
  <link rel="stylesheet" href="../styles/base.css">
  <link rel="stylesheet" href="../styles/components.css">
<link rel="stylesheet" href="../styles/capture.css">
<style>
.card .clab{font-family:var(--mono);font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-40);margin-bottom:4px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.card .clab .st{margin-left:auto;text-transform:none;letter-spacing:0;font-family:var(--ui);font-size:11.5px;font-weight:600;color:var(--forest-2);background:var(--sage-tint);border-radius:var(--r-pill);padding:3px 10px}
.card .clab .st.wait{color:var(--ochre);background:var(--ochre-tint)}
.chk{list-style:none;display:flex;flex-direction:column}
.chk li{display:flex;align-items:center;gap:12px;padding:13px 0;border-bottom:1px solid var(--line);cursor:pointer}
.chk li:last-child{border-bottom:none}
.chk li .box{width:24px;height:24px;border-radius:7px;border:1.8px solid var(--line-2);flex-shrink:0;display:grid;place-items:center;color:transparent;background:var(--plan)}
.chk li.on .box{background:var(--forest);border-color:var(--forest);color:var(--cream)}
.chk li .box svg{width:14px;height:14px}
.chk li .lbl{font-size:14.5px;color:var(--ink)}
.photos{display:grid;grid-template-columns:1fr 1fr;gap:10px}
</style>
<link rel="manifest" href="../manifest.json">
<meta name="theme-color" content="#112411">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="TACEDGE">
<link rel="apple-touch-icon" href="../assets/icons/apple-touch-icon.png?v=2026-07-16.1-06-26.7">
  <script src="../config/screens.js"></script>
  <script src="../components/header.js"></script>
</head>
<body class="field">
  <header></header>
  <script>TE_HEADER.fill('backfill-inspection')</script>

  <div class="signed">
    <span class="tick"><svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6L9 17l-5-5"/></svg></span>
    <span>Signed on <b>06:50</b> &middot; before-backfill walkdown</span><span class="jsa">JSA-620 ACK</span>
  </div>

  <main class="wrap">
    <div class="phead">
      <h1>Backfill Inspection</h1>
      <div class="psub" id="psub">Before backfill · hold point</div>
    </div>

    <div class="pilesel" id="pilesel"></div>

    <div class="card">
      <div class="clab">Layer checks <span class="st" id="layerSt">—</span></div>
      <ul class="chk" id="chk"></ul>
    </div>

    <div class="card">
      <div class="clab">Layer photos</div>
      <div class="photos">
        <div class="ph"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="6" width="18" height="14" rx="2"/><circle cx="12" cy="13" r="3.5"/><path d="M8 6l1.5-2h5L16 6"/></svg><span>Geotextile &amp; bedding</span></div>
        <div class="ph"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="6" width="18" height="14" rx="2"/><circle cx="12" cy="13" r="3.5"/><path d="M8 6l1.5-2h5L16 6"/></svg><span>Pipe &amp; surround</span></div>
      </div>
    </div>

    <div class="card">
      <div class="clab">Witness hold</div>
      <div class="witness" id="witness"></div>
      <div class="wcap" id="wcap">Recorded on site</div>
    </div>
  </main>

  <div class="dock">
    <button class="btn" id="submitQA">
      <svg class="bico" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round"><path d="M22 2L11 13M22 2l-7 20-4-9-9-4 20-7z"/></svg>
      <span class="bt"><span class="bt1" id="dockT">Record inspection</span><span class="bt2" id="dockS">Layers, photos and witness recorded</span></span>
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18l6-6-6-6"/></svg>
    </button>
  </div>

  <script type="module">
  import { packFor } from '../data/mock/index.js';
  import { renderChecklist } from '../components/checklist.js';
  import { renderSelector } from '../components/selector.js';
  function esc(s){return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
  var CHK='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6L9 17l-5-5"/></svg>';
  var CLOCK='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>';
  var pack = packFor('drainage');
  var ago = pack && pack.agoPhrase ? pack.agoPhrase : function(n){ return n + ' days ago'; };
  if (pack && pack.collectorRuns && pack.collectorRuns.length) {
    var runs = pack.collectorRuns;
    function render(idx){
      var r = runs[idx], done = r.state === 'complete';
      document.getElementById('psub').textContent = 'Before backfill · ' + r.id + ' · ' + r.zone;
      var st = document.getElementById('layerSt');
      st.textContent = done ? 'Inspected' : 'Awaiting';
      st.className = 'st' + (done ? '' : ' wait');
      renderChecklist(document.getElementById('chk'), r.layers);
      var w = document.getElementById('witness');
      if (r.witnessedBy) {
        w.className = 'witness';
        w.innerHTML = '<span class="wic">' + CHK + '</span><span class="wx"><span class="w1">Witnessed · ' + esc(r.witnessedBy) + '</span>' +
          '<span class="w2">' + esc(ago(r.witnessedDaysAgo)) + ' · inspected before backfill</span></span>';
        document.getElementById('wcap').textContent = 'Recorded on site';
      } else {
        w.className = 'witness await';
        w.innerHTML = '<span class="wic">' + CLOCK + '</span><span class="wx"><span class="w1">Not yet witnessed</span>' +
          '<span class="w2">Backfill is held until the trench is signed off</span></span>';
        document.getElementById('wcap').textContent = 'Awaiting witness · hold point';
      }
      document.querySelectorAll('.pilesel .ps').forEach(function(el, i){ el.classList.toggle('sel', i === idx); });
    }
    renderSelector(document.getElementById('pilesel'), runs.map(function(r){
      return { primary: r.id, secondary: r.zone, cls: r.state === 'held' ? 'fail' : null };
    }), { onSelect: render });
    render(0);
    var dock = document.getElementById('submitQA');
    dock.addEventListener('click', function(){
      dock.classList.add('done');
      document.getElementById('dockT').textContent = 'Inspection recorded';
      document.getElementById('dockS').textContent = 'Cleared to backfill once witnessed';
      document.querySelector('.dock .bico').innerHTML = CHK;
    });
  }
  </script>

  <script defer src="../js/build.js"></script>
  <script defer src="../js/versioner.js"></script>
  <script defer src="../js/standalone.js"></script>
</body>
</html>
