<!DOCTYPE html>
<html lang="en-NZ">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TacEdge Geotech · Pin Install Record</title>
  <link rel="stylesheet" href="../styles/fonts.css">
  <link rel="stylesheet" href="../styles/tokens.css">
  <link rel="stylesheet" href="../styles/base.css">
  <link rel="stylesheet" href="../styles/components.css">
<link rel="stylesheet" href="../styles/capture.css">
<style>
.card .clab{font-family:var(--mono);font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-40);margin-bottom:12px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}

.idrow{display:flex;align-items:flex-end;justify-content:space-between;gap:14px}

.idrow .pid{font-family:var(--mono);font-size:32px;font-weight:700;color:var(--forest);line-height:1}

.idrow .pst{font-family:var(--mono);font-size:11px;font-weight:600;color:var(--forest-2);background:var(--sage-tint);border-radius:var(--r-pill);padding:5px 11px}

.fields{display:flex;flex-direction:column;gap:2px}

.frow{display:flex;align-items:center;justify-content:space-between;gap:14px;padding:12px 0;border-bottom:1px solid var(--line)}

.frow:last-child{border-bottom:none}

.frow .fk{font-size:13.5px;color:var(--ink-60)}

.frow .fv{font-family:var(--mono);font-size:15px;font-weight:600;color:var(--ink);text-align:right}

.frow .fv.entry{border:1.5px solid var(--line-2);border-radius:var(--r-sm);padding:6px 11px;background:var(--plan);min-width:120px}

.rules{list-style:none;display:flex;flex-direction:column;gap:9px}

.rules li{display:flex;align-items:flex-start;gap:10px;font-size:13.5px;color:var(--ink)}

.rules li .rc{width:18px;height:18px;border-radius:50%;background:var(--sage-tint);color:var(--forest);display:grid;place-items:center;flex-shrink:0;margin-top:1px}

.rules li .rc svg{width:11px;height:11px}

.photos{display:grid;grid-template-columns:1fr 1fr;gap:10px}

.ph{aspect-ratio:4/3;border:1.5px dashed var(--line-2);border-radius:var(--r-md);background:var(--plan);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:7px;color:var(--ink-40)}

.ph svg{width:24px;height:24px}

.ph span{font-size:11.5px;font-weight:600}
</style>
<link rel="manifest" href="../manifest.json">
<meta name="theme-color" content="#2b4721">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="TacEdge">
<link rel="apple-touch-icon" href="../assets/icons/apple-touch-icon.png?v=2026-06-26.7">
  <script src="../config/screens.js"></script>
  <script src="../components/header.js"></script>
</head>
<body class="field">
  <header></header>
  <script>TE_HEADER.fill('pin-install')</script>

  <div class="signed">
    <span class="tick"><svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6L9 17l-5-5"/></svg></span>
    <span>Signed on <b>07:04</b> &middot; cleared to install</span><span class="jsa">JSA-311 ACK</span>
  </div>

  <main class="wrap">
    <div class="phead">
      <h1>Pin Install Record</h1>
      <div class="psub" id="psub">Crest pin</div>
    </div>

    <div class="pilesel" id="pilesel"></div>

    <div class="card">
      <div class="idrow">
        <div class="pid" id="pid">—</div>
        <div class="pst" id="pst">—</div>
      </div>
    </div>

    <div class="card">
      <div class="clab">Install record</div>
      <div class="fields" id="fields"></div>
    </div>

    <div class="card">
      <div class="clab">Acceptance criteria</div>
      <ul class="rules" id="rules"></ul>
    </div>

    <div class="card">
      <div class="clab">Photos</div>
      <div class="photos">
        <div class="ph"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="6" width="18" height="14" rx="2"/><circle cx="12" cy="13" r="3.5"/><path d="M8 6l1.5-2h5L16 6"/></svg><span>Pin head</span></div>
        <div class="ph"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="6" width="18" height="14" rx="2"/><circle cx="12" cy="13" r="3.5"/><path d="M8 6l1.5-2h5L16 6"/></svg><span>Grout collar</span></div>
      </div>
    </div>
  </main>

  <div class="dock">
    <button class="btn" id="submitQA">
      <svg class="bico" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round"><path d="M22 2L11 13M22 2l-7 20-4-9-9-4 20-7z"/></svg>
      <span class="bt"><span class="bt1" id="dockT">Submit for QA</span><span class="bt2" id="dockS">Depth, grout batch and photos recorded</span></span>
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18l6-6-6-6"/></svg>
    </button>
  </div>

  <script type="module">
  import { packFor } from '../data/mock/index.js';
  import { WORK_TYPES } from '../config/workTypes.js';
  import { renderSelector } from '../components/selector.js';
  function esc(s){return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
  var CHK='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6L9 17l-5-5"/></svg>';
  var pack = packFor('rockfall');
  var wt = WORK_TYPES.rockfall;
  var cp1 = (wt.workItemTemplates || []).filter(function(t){return t.code==='CP1';})[0] || { rules: [] };
  if (pack && pack.pinInstalls && pack.pinInstalls.length) {
    var recs = pack.pinInstalls;
    document.getElementById('rules').innerHTML = cp1.rules.map(function(r){
      return '<li><span class="rc">' + CHK + '</span><span>' + esc(r.label) + '</span></li>';
    }).join('');

    function render(idx){
      var r = recs[idx];
      document.getElementById('psub').textContent = 'Crest pin · CP1';
      document.getElementById('pid').textContent = r.pin;
      document.getElementById('pst').textContent = r.state === 'confirmed' ? 'Confirmed' : 'Submitted';
      document.getElementById('fields').innerHTML =
        frow('Hole depth', r.depth.toFixed(1) + ' m', true) +
        frow('Grout batch', r.grout_batch, true) +
        frow('Grout volume', r.grout_volume, true) +
        frow('Bar serial', r.bar_serial, true) +
        frow('Photos', r.photos + ' attached', false) +
        frow('Captured by', r.by + ' · ' + r.date, false);
      document.querySelectorAll('.pilesel .ps').forEach(function(el, i){ el.classList.toggle('sel', i === idx); });
    }
    function frow(k, v, entry){
      return '<div class="frow"><span class="fk">' + esc(k) + '</span><span class="fv' + (entry ? ' entry' : '') + '">' + esc(v) + '</span></div>';
    }

    renderSelector(document.getElementById('pilesel'), recs.map(function(r){
      return { primary: r.pin, secondary: r.zone };
    }), { onSelect: render });
    render(0);

    var dock = document.getElementById('submitQA');
    dock.addEventListener('click', function(){
      dock.classList.add('done');
      document.getElementById('dockT').textContent = 'Submitted for QA';
      document.getElementById('dockS').textContent = 'PM will confirm against the acceptance criteria';
      document.querySelector('.dock .bico').innerHTML = CHK;
    });
  }
  </script>

  <script defer src="../js/build.js"></script>
  <script defer src="../js/versioner.js"></script>
  <script defer src="../js/standalone.js"></script>
</body>
</html>
