<!DOCTYPE html>
<html lang="en-NZ">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TacEdge Geotech · Thickness Check</title>
  <link rel="stylesheet" href="../styles/fonts.css">
  <link rel="stylesheet" href="../styles/tokens.css">
  <link rel="stylesheet" href="../styles/base.css">
  <link rel="stylesheet" href="../styles/components.css">
<link rel="stylesheet" href="../styles/capture.css">
<style>
.card .clab{font-family:var(--mono);font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-40);margin-bottom:12px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.card .clab .thr{margin-left:auto;text-transform:none;letter-spacing:0;font-family:var(--ui);font-size:11.5px;font-weight:600;color:var(--forest-2);background:var(--sage-tint);border-radius:var(--r-pill);padding:3px 10px}
.pilesel .ps.fail .pn{color:var(--brick)}
.pilesel .ps.sel.fail{border-color:var(--brick);background:var(--brick-tint)}
.idrow{display:flex;align-items:flex-end;justify-content:space-between;gap:14px}
.idrow .pid{font-family:var(--mono);font-size:32px;font-weight:700;color:var(--forest);line-height:1}
.idrow .pst{font-family:var(--mono);font-size:11px;font-weight:600;color:var(--forest-2);background:var(--sage-tint);border-radius:var(--r-pill);padding:5px 11px}
.idrow .pst.fail{color:var(--brick);background:var(--brick-tint)}
.rd-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}
.rd{background:var(--plan);border:1.5px solid var(--line-2);border-radius:var(--r-md);padding:12px 6px;text-align:center}
.rd .rn{font-family:var(--mono);font-size:10px;color:var(--ink-40)}
.rd .rv{font-family:var(--mono);font-size:19px;font-weight:700;color:var(--ink);margin-top:4px}
.rd.low{background:var(--brick-tint);border-color:var(--brick)}
.rd.low .rv{color:var(--brick)}
.sum{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px}
.sum .s{background:var(--plan);border:1px solid var(--line);border-radius:var(--r-md);padding:12px}
.sum .s .k{font-size:11px;color:var(--ink-40)}
.sum .s .v{font-family:var(--mono);font-size:20px;font-weight:700;color:var(--ink);margin-top:5px}
.sum .s .v.bad{color:var(--brick)} .sum .s .v.ok{color:var(--forest-2)}
.sum .s .rule{font-size:10.5px;color:var(--ink-40);margin-top:3px}
.note{display:flex;align-items:flex-start;gap:10px;background:var(--brick-tint);border:1px solid #e6c2ba;border-radius:var(--r-md);padding:12px 14px;margin-top:14px;font-size:13px;color:var(--ink);line-height:1.5}
.note .ni{width:20px;height:20px;flex-shrink:0;color:var(--brick);margin-top:1px}
.note b{color:var(--brick)}
.respray{margin-top:14px;padding-top:14px;border-top:1px dashed var(--line-2)}
.respray .rtitle{font-family:var(--mono);font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--forest-2);margin-bottom:10px;display:flex;align-items:center;gap:7px}
.respray .rtitle svg{width:13px;height:13px}
</style>
<link rel="manifest" href="../manifest.json">
<meta name="theme-color" content="#2b4721">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="TacEdge">
<link rel="apple-touch-icon" href="../assets/icons/apple-touch-icon.png?v=2026-06-26.7">
  <script src="../config/screens.js"></script>
  <script src="../components/header.js"></script>
</head>
<body class="field">
  <header></header>
  <script>TE_HEADER.fill('thickness-check')</script>

  <div class="signed">
    <span class="tick"><svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6L9 17l-5-5"/></svg></span>
    <span>Signed on <b>06:48</b> &middot; probe survey</span><span class="jsa">JSA-402 ACK</span>
  </div>

  <main class="wrap">
    <div class="phead">
      <h1>Thickness Check</h1>
      <div class="psub" id="psub">Sprayed concrete · probe readings</div>
    </div>

    <div class="pilesel" id="pilesel"></div>

    <div class="card">
      <div class="idrow">
        <div class="pid" id="pid">—</div>
        <div class="pst" id="pst">—</div>
      </div>
    </div>

    <div class="card">
      <div class="clab">Probe readings <span class="thr" id="thr">Mean ≥ 100 mm · min ≥ 75 mm</span></div>
      <div class="rd-grid" id="rdGrid"></div>
      <div class="sum" id="sum"></div>
      <div id="noteWrap"></div>
    </div>
  </main>

  <div class="dock">
    <button class="btn" id="submitQA">
      <svg class="bico" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round"><path d="M22 2L11 13M22 2l-7 20-4-9-9-4 20-7z"/></svg>
      <span class="bt"><span class="bt1" id="dockT">Submit for QA</span><span class="bt2" id="dockS">Probe readings recorded</span></span>
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18l6-6-6-6"/></svg>
    </button>
  </div>

  <script type="module">
  import { packFor } from '../data/mock/index.js';
  import { WORK_TYPES } from '../config/workTypes.js';
  function esc(s){return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
  var CHK='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6L9 17l-5-5"/></svg>';
  var WARN='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 4l9 16H3z"/><path d="M12 10v4"/><path d="M12 17.4v.01"/></svg>';
  var pack = packFor('shotcrete');
  var wt = WORK_TYPES.shotcrete;
  var ago = pack && pack.agoPhrase ? pack.agoPhrase : function(n){ return n + ' days ago'; };
  function ruleVal(field, dflt){ var r = (wt.rules || []).filter(function(x){return x.field===field;})[0]; return r ? r.value : dflt; }
  var MEAN_MIN = ruleVal('thickness_mean_mm', 100), MIN_MIN = ruleVal('thickness_min_mm', 75);
  if (pack && pack.thicknessChecks && pack.thicknessChecks.length) {
    var recs = pack.thicknessChecks;
    document.getElementById('thr').textContent = 'Mean ≥ ' + MEAN_MIN + ' mm · min ≥ ' + MIN_MIN + ' mm';
    function grid(readings){
      return readings.map(function(v, i){
        return '<div class="rd' + (v < MIN_MIN ? ' low' : '') + '"><div class="rn">P' + (i + 1) + '</div><div class="rv">' + v + '</div></div>';
      }).join('');
    }
    function summ(readings){
      var mean = Math.round(readings.reduce(function(a, b){ return a + b; }, 0) / readings.length * 10) / 10;
      var min = Math.min.apply(null, readings);
      return '<div class="s"><div class="k">Mean thickness</div><div class="v ' + (mean >= MEAN_MIN ? 'ok' : 'bad') + '">' + mean + ' mm</div><div class="rule">≥ ' + MEAN_MIN + ' mm</div></div>' +
        '<div class="s"><div class="k">Minimum</div><div class="v ' + (min >= MIN_MIN ? 'ok' : 'bad') + '">' + min + ' mm</div><div class="rule">≥ ' + MIN_MIN + ' mm</div></div>';
    }
    function render(idx){
      var r = recs[idx], fail = !r.pass, reopened = r.state === 'reopened';
      document.getElementById('psub').textContent = 'Sprayed concrete · ' + r.lot;
      document.getElementById('pid').textContent = r.panel;
      var st = document.getElementById('pst');
      st.textContent = reopened ? 'Reopened' : (r.state === 'confirmed' ? 'Confirmed' : 'Submitted');
      st.className = 'pst' + (fail ? ' fail' : '');
      document.getElementById('rdGrid').innerHTML = grid(r.readings);
      document.getElementById('sum').innerHTML = summ(r.readings);
      var extra = '';
      if (fail && r.note) {
        extra += '<div class="note"><span class="ni">' + WARN + '</span><span><b>Minimum ' + r.failedReading + ' mm below ' + MIN_MIN + ' mm.</b> ' + esc(r.note) + '.</span></div>';
      }
      if (r.resprayReadings) {
        extra += '<div class="respray"><div class="rtitle">' + CHK + ' Ground and re-sprayed · ' + esc(ago(r.resprayDaysAgo)) + '</div>' +
          '<div class="rd-grid">' + grid(r.resprayReadings) + '</div><div class="sum">' + summ(r.resprayReadings) + '</div></div>';
      }
      document.getElementById('noteWrap').innerHTML = extra;
      document.querySelectorAll('.pilesel .ps').forEach(function(el, i){ el.classList.toggle('sel', i === idx); });
    }
    document.getElementById('pilesel').innerHTML = recs.map(function(r, i){
      var fail = !r.pass;
      return '<button class="ps' + (i === 0 ? ' sel' : '') + (fail ? ' fail' : '') + '" data-i="' + i + '"><span class="pn">' + esc(r.panel) + '</span><span class="pz">' + esc(r.lot) + '</span></button>';
    }).join('');
    document.querySelectorAll('.pilesel .ps').forEach(function(el){
      el.addEventListener('click', function(){ render(+el.dataset.i); });
    });
    render(0);
    var dock = document.getElementById('submitQA');
    dock.addEventListener('click', function(){
      dock.classList.add('done');
      document.getElementById('dockT').textContent = 'Submitted for QA';
      document.getElementById('dockS').textContent = 'PM confirms once the 28-day core result is in';
      document.querySelector('.dock .bico').innerHTML = CHK;
    });
  }
  </script>

  <script defer src="../js/build.js"></script>
  <script defer src="../js/versioner.js"></script>
  <script defer src="../js/standalone.js"></script>
</body>
</html>
