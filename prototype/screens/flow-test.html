<!DOCTYPE html>
<html lang="en-NZ">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TacEdge Ground Engineering · Flow Test</title>
  <link rel="stylesheet" href="../styles/fonts.css">
  <link rel="stylesheet" href="../styles/tokens.css">
  <link rel="stylesheet" href="../styles/base.css">
  <link rel="stylesheet" href="../styles/components.css">
<link rel="stylesheet" href="../styles/capture.css">
<style>
.card .clab{font-family:var(--mono);font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-40);margin-bottom:8px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.flowhero{display:flex;align-items:baseline;gap:10px;margin:4px 0 6px}
.flowhero .fn{font-family:var(--display);font-weight:700;font-size:44px;color:var(--ink);line-height:1}
.flowhero .fu{font-family:var(--mono);font-size:16px;color:var(--ink-60)}
.flowchip{display:inline-flex;align-items:center;gap:7px;font-family:var(--ui);font-size:12.5px;font-weight:700;padding:5px 12px;border-radius:var(--r-pill);background:var(--plan);color:var(--ink-60)}
.flowchip .d{width:8px;height:8px;border-radius:50%;background:var(--ink-40)}
.flowchip.pending{background:var(--plan);color:var(--ink-40)}
.flownote{font-size:12.5px;color:var(--ink-60);margin-top:10px}
.meta2{display:grid;grid-template-columns:1fr 1fr;gap:12px 16px}
.meta2 .k{font-family:var(--mono);font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-40)}
.meta2 .v{font-size:14px;font-weight:600;color:var(--ink);margin-top:2px}
.photos{display:grid;grid-template-columns:1fr 1fr;gap:10px}
</style>
<link rel="manifest" href="../manifest.json">
<meta name="theme-color" content="#2b4721">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="TacEdge">
<link rel="apple-touch-icon" href="../assets/icons/apple-touch-icon.png?v=2026-06-26.7">
  <script src="../config/screens.js"></script>
  <script src="../components/header.js"></script>
</head>
<body class="field">
  <header></header>
  <script>TE_HEADER.fill('flow-test')</script>

  <div class="signed">
    <span class="tick"><svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6L9 17l-5-5"/></svg></span>
    <span>Signed on <b>06:50</b> &middot; flow at collar</span><span class="jsa">JSA-620 ACK</span>
  </div>

  <main class="wrap">
    <div class="phead">
      <h1>Flow Test</h1>
      <div class="psub" id="psub">Recorded at collar</div>
    </div>

    <div class="pilesel" id="pilesel"></div>

    <div class="card">
      <div class="clab">Flow at completion</div>
      <div class="flowhero"><span class="fn" id="flowN">—</span><span class="fu">L/min</span></div>
      <span class="flowchip" id="flowChip"><span class="d"></span>—</span>
      <div class="flownote" id="flowNote"></div>
    </div>

    <div class="card">
      <div class="clab">Record</div>
      <div class="meta2" id="meta"></div>
    </div>

    <div class="card">
      <div class="clab">Collar photo</div>
      <div class="photos" id="photos"></div>
    </div>
  </main>

  <div class="dock">
    <button class="btn" id="submitQA">
      <svg class="bico" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round"><path d="M22 2L11 13M22 2l-7 20-4-9-9-4 20-7z"/></svg>
      <span class="bt"><span class="bt1" id="dockT">Record flow</span><span class="bt2" id="dockS">Recorded at collar · zero is a valid result</span></span>
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18l6-6-6-6"/></svg>
    </button>
  </div>

  <script type="module">
  import { packFor } from '../data/mock/index.js';
  import { renderSelector } from '../components/selector.js';
  function esc(s){return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
  var CHK='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6L9 17l-5-5"/></svg>';
  var CAM='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="6" width="18" height="14" rx="2"/><circle cx="12" cy="13" r="3.5"/><path d="M8 6l1.5-2h5L16 6"/></svg>';
  var pack = packFor('drainage');
  var ago = pack && pack.agoPhrase ? pack.agoPhrase : function(n){ return n + ' days ago'; };
  if (pack && pack.drains) {
    var drains = pack.drains, det = pack.drainDetail || {};
    function render(idx){
      var it = drains[idx], d = det[it.id] || {};
      document.getElementById('psub').textContent = 'Recorded at collar · ' + it.collar;
      var tested = it.flow_L_min != null;
      document.getElementById('flowN').textContent = tested ? it.flow_L_min.toFixed(1) : '—';
      var chip = document.getElementById('flowChip');
      if (!tested) { chip.className = 'flowchip pending'; chip.innerHTML = '<span class="d"></span>Not yet tested'; }
      else if (it.flowState === 'dry') { chip.className = 'flowchip'; chip.innerHTML = '<span class="d"></span>Dry at completion · recorded'; }
      else { chip.className = 'flowchip'; chip.innerHTML = '<span class="d"></span>Flow recorded'; }
      document.getElementById('flowNote').textContent = it.flowState === 'dry'
        ? 'A dry drain is a valid outcome. Zero flow is recorded as the finding, and the run is complete.'
        : (tested ? 'Flow measured at the collar on completion.' : 'Flow is recorded once the drain is installed.');
      document.getElementById('meta').innerHTML = [
        ['Flow tested', d.flowTestedDaysAgo != null ? ago(d.flowTestedDaysAgo) : 'pending'],
        ['Weather', d.weather || '—'],
        ['Design length', it.design_length_m.toFixed(1) + ' m'],
        ['Collar', it.collar]
      ].map(function(f){ return '<div><div class="k">' + esc(f[0]) + '</div><div class="v">' + esc(f[1]) + '</div></div>'; }).join('');
      document.getElementById('photos').innerHTML =
        '<div class="ph">' + CAM + '<span>Collar</span></div>' +
        '<div class="ph">' + CAM + '<span>Outfall</span></div>';
      document.querySelectorAll('.pilesel .ps').forEach(function(el, i){ el.classList.toggle('sel', i === idx); });
    }
    renderSelector(document.getElementById('pilesel'), drains.map(function(it){
      return { primary: it.id, secondary: it.collar };
    }), { onSelect: render });
    render(0);
    var dock = document.getElementById('submitQA');
    dock.addEventListener('click', function(){
      dock.classList.add('done');
      document.getElementById('dockT').textContent = 'Flow recorded';
      document.getElementById('dockS').textContent = 'Attached to the drain record';
      document.querySelector('.dock .bico').innerHTML = CHK;
    });
  }
  </script>

  <script defer src="../js/build.js"></script>
  <script defer src="../js/versioner.js"></script>
  <script defer src="../js/standalone.js"></script>
</body>
</html>
