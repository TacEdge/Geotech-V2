<!DOCTYPE html>
<html lang="en-NZ">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TacEdge Ground Engineering · Panel Install Record</title>
  <link rel="stylesheet" href="../styles/fonts.css">
  <link rel="stylesheet" href="../styles/tokens.css">
  <link rel="stylesheet" href="../styles/base.css">
  <link rel="stylesheet" href="../styles/components.css">
<link rel="stylesheet" href="../styles/capture.css">
<style>
.card .clab{font-family:var(--mono);font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-40);margin-bottom:12px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}

.card .clab .lot{margin-left:auto;text-transform:none;letter-spacing:0;font-family:var(--ui);font-size:11.5px;font-weight:600;color:var(--forest-2);background:var(--sage-tint);border-radius:var(--r-pill);padding:3px 10px}

.idrow{display:flex;align-items:flex-end;justify-content:space-between;gap:14px}

.idrow .pid{font-family:var(--mono);font-size:32px;font-weight:700;color:var(--forest);line-height:1}

.idrow .pst{font-family:var(--mono);font-size:11px;font-weight:600;color:var(--forest-2);background:var(--sage-tint);border-radius:var(--r-pill);padding:5px 11px}

.meta{display:grid;grid-template-columns:1fr 1fr;gap:10px 14px;margin-top:16px}

.meta .m .k{font-size:11px;color:var(--ink-40)}

.meta .m .v{font-family:var(--mono);font-size:14px;font-weight:600;color:var(--ink);margin-top:2px}

.check{display:flex;align-items:center;gap:12px}

.check .cn{font-family:var(--mono);font-size:30px;font-weight:700;color:var(--forest);line-height:1}

.check .cx{flex:1}

.check .c1{font-size:14px;font-weight:600;color:var(--ink)}

.check .c2{font-size:12px;color:var(--ink-40);margin-top:2px}

.check .cb{font-family:var(--mono);font-size:11px;font-weight:700;color:var(--forest-2);background:var(--sage-tint);border-radius:var(--r-pill);padding:5px 11px}

.serials{display:flex;flex-wrap:wrap;gap:8px}

.serials .sc{font-family:var(--mono);font-size:12.5px;font-weight:600;color:var(--ink);background:var(--plan);border:1.5px solid var(--line-2);border-radius:var(--r-sm);padding:6px 11px}

.linked{display:flex;align-items:center;gap:12px}

.linked .lk{width:34px;height:34px;border-radius:50%;flex-shrink:0;display:grid;place-items:center}

.linked .lk.ok{background:var(--sage-tint);color:var(--forest)}
 .linked .lk.wait{background:var(--ochre-tint);color:var(--ochre)}

.linked .lk svg{width:18px;height:18px}

.linked .lx{flex:1}

.linked .l1{font-size:14px;font-weight:600;color:var(--ink)}

.linked .l2{font-size:12px;color:var(--ink-60);margin-top:2px}

.rules{list-style:none;display:flex;flex-direction:column;gap:9px}

.rules li{display:flex;align-items:flex-start;gap:10px;font-size:13.5px;color:var(--ink)}

.rules li .rc{width:18px;height:18px;border-radius:50%;background:var(--sage-tint);color:var(--forest);display:grid;place-items:center;flex-shrink:0;margin-top:1px}

.rules li .rc svg{width:11px;height:11px}

/* photo placeholders now in capture.css */
</style>
<link rel="manifest" href="../manifest.json">
<meta name="theme-color" content="#112411">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="TacEdge">
<link rel="apple-touch-icon" href="../assets/icons/apple-touch-icon.png?v=2026-07-16.1-06-26.7">
  <script src="../config/screens.js"></script>
  <script src="../components/header.js"></script>
</head>
<body class="field">
  <header></header>
  <script>TE_HEADER.fill('panel-install')</script>

  <div class="signed">
    <span class="tick"><svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6L9 17l-5-5"/></svg></span>
    <span>Signed on <b>07:04</b> &middot; cleared to install</span><span class="jsa">JSA-311 ACK</span>
  </div>

  <main class="wrap">
    <div class="phead">
      <h1>Panel Install Record</h1>
      <div class="psub" id="psub">Drapery mesh panel</div>
    </div>

    <div class="pilesel" id="pilesel"></div>

    <div class="card">
      <div class="idrow">
        <div class="pid" id="pid">—</div>
        <div class="pst" id="pst">—</div>
      </div>
      <div class="meta" id="meta"></div>
    </div>

    <div class="card">
      <div class="clab">Overlap &amp; lacing</div>
      <div class="check">
        <span class="cn" id="ovVal">—</span>
        <span class="cx"><span class="c1" id="ovLbl">Mesh overlap</span><span class="c2" id="ovLace">—</span></span>
        <span class="cb" id="ovChip">—</span>
      </div>
    </div>

    <div class="card">
      <div class="clab">Fixing serials</div>
      <div class="serials" id="serials"></div>
    </div>

    <div class="card">
      <div class="clab">Linked crest pins</div>
      <div class="linked" id="linked"></div>
    </div>

    <div class="card">
      <div class="clab">Acceptance criteria</div>
      <ul class="rules" id="rules"></ul>
    </div>

    <div class="card">
      <div class="clab">Photos</div>
      <div class="photos">
        <div class="ph"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="6" width="18" height="14" rx="2"/><circle cx="12" cy="13" r="3.5"/><path d="M8 6l1.5-2h5L16 6"/></svg><span>Panel face</span></div>
        <div class="ph"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="6" width="18" height="14" rx="2"/><circle cx="12" cy="13" r="3.5"/><path d="M8 6l1.5-2h5L16 6"/></svg><span>Overlap lacing</span></div>
      </div>
    </div>
  </main>

  <div class="dock">
    <button class="btn" id="submitQA">
      <svg class="bico" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round"><path d="M22 2L11 13M22 2l-7 20-4-9-9-4 20-7z"/></svg>
      <span class="bt"><span class="bt1" id="dockT">Submit for QA</span><span class="bt2" id="dockS">Overlaps, serials and photos recorded</span></span>
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18l6-6-6-6"/></svg>
    </button>
  </div>

  <script type="module">
  import { packFor } from '../data/mock/index.js';
  import { WORK_TYPES } from '../config/workTypes.js';
  import { PROJECTS } from '../config/projects.js';
  import { renderSelector } from '../components/selector.js';
  function esc(s){return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
  var CHK='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6L9 17l-5-5"/></svg>';
  var CLOCK='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>';
  var pack = packFor('rockfall');
  var wt = WORK_TYPES.rockfall;
  var project = PROJECTS['coastal-corridor'];
  var dm1 = (wt.workItemTemplates || []).filter(function(t){return t.code==='DM1';})[0] || { rules: [] };
  if (pack && project) {
    var panels = project.items.filter(function(it){return it.geometry === 'area';});
    var installs = {}; (pack.panelInstalls || []).forEach(function(p){ installs[p.panel] = p; });
    var lotsById = {}; (pack.lots || []).forEach(function(l){ lotsById[l.id] = l; });
    var ovRule = (dm1.rules || []).filter(function(r){return r.field==='overlap_mm';})[0] || { value: 300, unit: 'mm' };
    document.getElementById('rules').innerHTML = dm1.rules.map(function(r){
      return '<li><span class="rc">' + CHK + '</span><span>' + esc(r.label) + '</span></li>';
    }).join('');

    function render(idx){
      var it = panels[idx], rec = installs[it.id], lot = lotsById[it.lot] || {};
      document.getElementById('psub').textContent = 'Drapery mesh · DM1 · ' + it.lot;
      document.getElementById('pid').textContent = it.id;
      var stName = it.state === 'approved' ? 'Confirmed' : (rec ? 'Submitted' : (it.state === 'provisional' ? 'Installed' : 'Planned'));
      document.getElementById('pst').textContent = stName;
      document.getElementById('meta').innerHTML =
        '<div class="m"><div class="k">Lot</div><div class="v">' + esc(it.lot) + '</div></div>' +
        '<div class="m"><div class="k">Zone</div><div class="v">' + esc(it.zone) + '</div></div>' +
        '<div class="m"><div class="k">Panel area</div><div class="v">' + it.area + ' m&sup2;</div></div>' +
        '<div class="m"><div class="k">Captured by</div><div class="v">' + esc(rec ? rec.by : '—') + '</div></div>';

      var ov = rec ? rec.overlap_mm : it.overlapFinal;
      var ovEl = document.getElementById('ovVal'), chip = document.getElementById('ovChip');
      if (ov != null) {
        ovEl.textContent = ov; document.getElementById('ovLbl').textContent = 'Mesh overlap (mm)';
        document.getElementById('ovLace').textContent = rec ? rec.lacing : 'Laced';
        var pass = ov >= ovRule.value;
        chip.textContent = pass ? '≥ ' + ovRule.value + ' mm' : 'below ' + ovRule.value + ' mm';
      } else {
        ovEl.textContent = '—'; document.getElementById('ovLace').textContent = 'Not yet installed'; chip.textContent = 'pending';
      }

      var fx = rec ? rec.fixings : null;
      document.getElementById('serials').innerHTML = fx && fx.length
        ? fx.map(function(s){ return '<span class="sc">' + esc(s) + '</span>'; }).join('')
        : '<span class="c2" style="font-size:13px;color:var(--ink-40)">Serials recorded at install.</span>';

      var conf = lot.pinsConfirmed || 0, total = (lot.pins || []).length, ready = total && conf >= total;
      document.getElementById('linked').innerHTML =
        '<span class="lk ' + (ready ? 'ok' : 'wait') + '">' + (ready ? CHK : CLOCK) + '</span>' +
        '<span class="lx"><span class="l1">' + conf + ' of ' + total + ' crest pins confirmed</span>' +
        '<span class="l2">DM1 sequence · CP1 pins confirmed before ' + esc(it.lot) + ' can be confirmed</span></span>';
      document.querySelectorAll('.pilesel .ps').forEach(function(el, i){ el.classList.toggle('sel', i === idx); });
    }

    renderSelector(document.getElementById('pilesel'), panels.map(function(it){
      return { primary: it.id, secondary: it.lot };
    }), { onSelect: render });
    // Open on MP-02, the panel with a captured record.
    var start = panels.map(function(it){return it.id;}).indexOf('MP-02');
    render(start < 0 ? 0 : start);

    var dock = document.getElementById('submitQA');
    dock.addEventListener('click', function(){
      dock.classList.add('done');
      document.getElementById('dockT').textContent = 'Submitted for QA';
      document.getElementById('dockS').textContent = 'PM will confirm against the acceptance criteria';
      document.querySelector('.dock .bico').innerHTML = CHK;
    });
  }
  </script>

  <script defer src="../js/build.js"></script>
  <script defer src="../js/versioner.js"></script>
  <script defer src="../js/standalone.js"></script>
</body>
</html>
