<!DOCTYPE html>
<html lang="en-NZ">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TacEdge Ground Engineering · Core Photos</title>
  <link rel="stylesheet" href="../styles/fonts.css">
  <link rel="stylesheet" href="../styles/tokens.css">
  <link rel="stylesheet" href="../styles/base.css">
  <link rel="stylesheet" href="../styles/components.css">
<link rel="stylesheet" href="../styles/capture.css">
<style>
.card .clab{font-family:var(--mono);font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-40);margin-bottom:8px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.card .clab .bx{margin-left:auto;text-transform:none;letter-spacing:0;font-family:var(--mono);font-size:12px;font-weight:600;color:var(--forest-2)}
.card .clab .st{margin-left:auto;text-transform:none;letter-spacing:0;font-family:var(--ui);font-size:11.5px;font-weight:600;color:var(--forest-2);background:var(--sage-tint);border-radius:var(--r-pill);padding:3px 10px}
.card .clab .st.wait{color:var(--ochre);background:var(--ochre-tint)}
.ph{position:relative}
.ph.on{border-style:solid;border-color:#cdd5b9;background:var(--sage-tint);color:var(--forest-2)}
.ph .tag{position:absolute;top:7px;right:8px;font-family:var(--mono);font-size:9.5px;letter-spacing:.08em;text-transform:uppercase}
.lblchk{display:flex;align-items:center;gap:9px;margin-top:11px;font-size:12.5px;color:var(--ink-60)}
.lblchk .b{width:20px;height:20px;border-radius:6px;display:grid;place-items:center;background:var(--forest);color:var(--cream);flex-shrink:0}
.lblchk .b svg{width:12px;height:12px}
.lblchk .b.no{background:var(--plan);color:transparent;border:1.6px solid var(--line-2)}
.brange{font-family:var(--mono);font-size:11.5px;color:var(--ink-40);margin-bottom:9px}
.empty{padding:18px 2px;text-align:center;color:var(--ink-40);font-size:13px}
</style>
<link rel="manifest" href="../manifest.json">
<meta name="theme-color" content="#112411">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="TacEdge">
<link rel="apple-touch-icon" href="../assets/icons/apple-touch-icon.png?v=2026-06-26.7">
  <script src="../config/screens.js"></script>
  <script src="../components/header.js"></script>
</head>
<body class="field">
  <header></header>
  <script>TE_HEADER.fill('core-photos')</script>

  <div class="signed">
    <span class="tick"><svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6L9 17l-5-5"/></svg></span>
    <span>Signed on <b>06:40</b> &middot; core box photos</span><span class="jsa">JSA-511 ACK</span>
  </div>

  <main class="wrap">
    <div class="phead">
      <h1>Core Photos</h1>
      <div class="psub" id="psub">Per box · wet and dry</div>
    </div>

    <div class="pilesel" id="pilesel"></div>

    <div id="boxes"></div>
  </main>

  <div class="dock">
    <button class="btn" id="submitQA">
      <svg class="bico" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round"><path d="M22 2L11 13M22 2l-7 20-4-9-9-4 20-7z"/></svg>
      <span class="bt"><span class="bt1" id="dockT">Record photos</span><span class="bt2" id="dockS">Wet and dry per box</span></span>
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18l6-6-6-6"/></svg>
    </button>
  </div>

  <script type="module">
  import { packFor } from '../data/mock/index.js';
  import { renderSelector } from '../components/selector.js';
  function esc(s){return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
  var CHK='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6L9 17l-5-5"/></svg>';
  var CAM='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="6" width="18" height="14" rx="2"/><circle cx="12" cy="13" r="3.5"/><path d="M8 6l1.5-2h5L16 6"/></svg>';
  function slot(on, label){
    return '<div class="ph' + (on ? ' on' : '') + '">' + (on ? '<span class="tag">On file</span>' : '') + CAM + '<span>' + label + '</span></div>';
  }
  var pack = packFor('drilling');
  if (pack && pack.holes && pack.holes.length) {
    var holes = pack.holes;
    function render(idx){
      var h = holes[idx];
      document.getElementById('psub').textContent = 'Per box · wet and dry · ' + h.id;
      var boxes = h.boxes || [];
      document.getElementById('boxes').innerHTML = boxes.length
        ? boxes.map(function(b){
            var full = b.photo_wet && b.photo_dry;
            return '<div class="card">' +
              '<div class="clab">Box ' + esc(b.no) + ' <span class="st' + (full ? '' : ' wait') + '">' + (full ? 'Both on file' : 'Incomplete') + '</span></div>' +
              '<div class="brange">' + b.from.toFixed(1) + ' &ndash; ' + b.to.toFixed(1) + ' m</div>' +
              '<div class="photos">' + slot(b.photo_wet, 'Wet') + slot(b.photo_dry, 'Dry') + '</div>' +
              '<div class="lblchk"><span class="b' + (b.label ? '' : ' no') + '">' + (b.label ? CHK : '') + '</span>Label check · box marked with hole and depth</div>' +
            '</div>';
          }).join('')
        : '<div class="card"><div class="empty">No core boxes yet for ' + esc(h.id) + '.</div></div>';
      document.querySelectorAll('.pilesel .ps').forEach(function(el, i){ el.classList.toggle('sel', i === idx); });
    }
    renderSelector(document.getElementById('pilesel'), holes.map(function(h){
      return { primary: h.id, secondary: h.zone };
    }), { onSelect: render });
    render(0);
    var dock = document.getElementById('submitQA');
    dock.addEventListener('click', function(){
      dock.classList.add('done');
      document.getElementById('dockT').textContent = 'Photos recorded';
      document.getElementById('dockS').textContent = 'Attached to the box register';
      document.querySelector('.dock .bico').innerHTML = CHK;
    });
  }
  </script>

  <script defer src="../js/build.js"></script>
  <script defer src="../js/versioner.js"></script>
  <script defer src="../js/standalone.js"></script>
</body>
</html>
