<!DOCTYPE html>
<html lang="en-NZ">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TACEDGE Ground Engineering · Borehole Log</title>
  <link rel="stylesheet" href="../styles/fonts.css">
  <link rel="stylesheet" href="../styles/tokens.css">
  <link rel="stylesheet" href="../styles/base.css">
  <link rel="stylesheet" href="../styles/components.css">
<link rel="stylesheet" href="../styles/capture.css">
<style>
.card .clab{font-family:var(--mono);font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-40);margin-bottom:8px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.card .clab .st{margin-left:auto;text-transform:none;letter-spacing:0;font-family:var(--ui);font-size:11.5px;font-weight:600;color:var(--forest-2);background:var(--sage-tint);border-radius:var(--r-pill);padding:3px 10px}
.card .clab .st.prog{color:var(--ochre);background:var(--ochre-tint)}
.card .clab .st.plan{color:var(--ink-40);background:var(--plan)}
.hstrip{display:grid;grid-template-columns:1fr 1fr;gap:12px 16px}
.hstrip .hf .k{font-family:var(--mono);font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-40)}
.hstrip .hf .v{font-size:14px;font-weight:600;color:var(--ink);margin-top:2px}
.soil{display:flex;gap:11px;padding:7px 0;border-bottom:1px solid var(--line)}
.soil:last-child{border-bottom:none}
.soil .sd{font-family:var(--mono);font-size:12px;font-weight:600;color:var(--forest-2);white-space:nowrap;width:78px;flex-shrink:0}
.soil .st2{font-size:13px;color:var(--ink)}
.spt{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.spt .s{border:1px solid var(--line);border-radius:var(--r-md);padding:7px 11px;background:var(--plan)}
.spt .s .k{font-family:var(--mono);font-size:10px;color:var(--ink-40)}
.spt .s .v{font-size:14px;font-weight:700;color:var(--ink);margin-top:2px}
table.rt{width:100%;border-collapse:collapse}
table.rt th{font-family:var(--mono);font-size:9.5px;letter-spacing:.04em;text-transform:uppercase;color:var(--ink-40);text-align:right;font-weight:600;padding:6px 5px;border-bottom:1px solid var(--line-2)}
table.rt th:first-child,table.rt th.l{text-align:left}
table.rt td{padding:9px 5px;border-bottom:1px solid var(--line);font-size:12.5px;vertical-align:top}
table.rt td.n{text-align:right;font-family:var(--mono);color:var(--ink);white-space:nowrap}
table.rt td.dp{text-align:left;font-family:var(--mono);font-weight:600;color:var(--forest-2);white-space:nowrap}
table.rt tr:last-child td{border-bottom:none}
table.rt tr.reopen td{background:var(--ochre-tint)}
.lith{color:var(--ink)}
.lith .cmt{display:block;font-size:11.5px;color:var(--ink-60);margin-top:3px}
.rst{display:inline-block;font-family:var(--ui);font-size:10.5px;font-weight:700;padding:2px 8px;border-radius:var(--r-pill);margin-top:6px}
.rst.ok{color:var(--forest-2);background:var(--sage-tint)}
.rst.reopen{color:var(--ochre);background:var(--ochre-tint)}
.wl{display:flex;align-items:center;gap:11px;padding:10px 0;border-bottom:1px solid var(--line)}
.wl:last-child{border-bottom:none}
.wl .wt{font-family:var(--mono);font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--forest-2);width:52px;flex-shrink:0}
.wl .wd{font-family:var(--mono);font-size:15px;font-weight:700;color:var(--ink);width:62px;flex-shrink:0}
.wl .wn{font-size:12.5px;color:var(--ink-60)}
.comp{display:grid;grid-template-columns:1fr 1fr;gap:12px 16px}
.comp .k{font-family:var(--mono);font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-40)}
.comp .v{font-size:14px;font-weight:600;color:var(--ink);margin-top:2px}
.empty{padding:18px 2px;text-align:center;color:var(--ink-40);font-size:13px}
.comp .empty{grid-column:1 / -1}
</style>
<link rel="manifest" href="../manifest.json">
<meta name="theme-color" content="#112411">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="TACEDGE">
<link rel="apple-touch-icon" href="../assets/icons/apple-touch-icon.png?v=2026-07-16.1-06-26.7">
  <script src="../config/screens.js"></script>
  <script src="../components/header.js"></script>
</head>
<body class="field">
  <header></header>
  <script>TE_HEADER.fill('borehole-log')</script>

  <div class="signed">
    <span class="tick"><svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6L9 17l-5-5"/></svg></span>
    <span>Signed on <b>06:40</b> &middot; borehole logging</span><span class="jsa">JSA-511 ACK</span>
  </div>

  <main class="wrap">
    <div class="phead">
      <h1>Borehole Log</h1>
      <div class="psub" id="psub">Cored investigation · HQ3</div>
    </div>

    <div class="pilesel" id="pilesel"></div>

    <div class="card">
      <div class="clab">Hole header <span class="st" id="holeSt">—</span></div>
      <div class="hstrip" id="hstrip"></div>
    </div>

    <div class="card">
      <div class="clab">Soils &amp; SPT</div>
      <div id="soils"></div>
      <div class="spt" id="spt"></div>
    </div>

    <div class="card">
      <div class="clab">Core runs <span class="st" id="runSt">—</span></div>
      <table class="rt">
        <thead><tr><th class="l">Run</th><th class="l">Depth m</th><th>Rec %</th><th>RQD %</th><th class="l">Lithology</th></tr></thead>
        <tbody id="runBody"></tbody>
      </table>
    </div>

    <div class="card">
      <div class="clab">Water observations</div>
      <div id="water"></div>
    </div>

    <div class="card">
      <div class="clab">Completion &amp; backfill</div>
      <div class="comp" id="comp"></div>
    </div>
  </main>

  <div class="dock">
    <button class="btn" id="submitQA">
      <svg class="bico" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round"><path d="M22 2L11 13M22 2l-7 20-4-9-9-4 20-7z"/></svg>
      <span class="bt"><span class="bt1" id="dockT">Submit for QA</span><span class="bt2" id="dockS">Runs, water and completion logged</span></span>
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18l6-6-6-6"/></svg>
    </button>
  </div>

  <script type="module">
  import { packFor } from '../data/mock/index.js';
  import { renderSelector } from '../components/selector.js';
  function esc(s){return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
  var CHK='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6L9 17l-5-5"/></svg>';
  function num(v){ return v == null ? '&mdash;' : v; }
  var pack = packFor('drilling');
  var ago = pack && pack.agoPhrase ? pack.agoPhrase : function(n){ return n + ' days ago'; };
  var STLBL = { complete: ['Confirmed', ''], in_progress: ['In progress', ' prog'], set_up: ['Set up', ' plan'], planned: ['Planned', ' plan'] };
  if (pack && pack.holes && pack.holes.length) {
    var holes = pack.holes;
    function render(idx){
      var h = holes[idx];
      document.getElementById('psub').textContent = 'Cored investigation · HQ3 · ' + h.zone;
      var lbl = STLBL[h.state] || ['—', ''];
      var st = document.getElementById('holeSt');
      st.textContent = lbl[0]; st.className = 'st' + lbl[1];

      document.getElementById('hstrip').innerHTML = [
        ['Rig', h.rig], ['Method', h.method], ['Driller', h.driller], ['Logger', h.logger],
        ['Casing', h.casing], ['Depth', h.drilled.toFixed(1) + ' / ' + h.designDepth.toFixed(1) + ' m']
      ].map(function(f){ return '<div class="hf"><div class="k">' + esc(f[0]) + '</div><div class="v">' + esc(f[1]) + '</div></div>'; }).join('');

      // Soils and SPT
      var soils = h.soils || [];
      document.getElementById('soils').innerHTML = soils.length
        ? soils.map(function(s){ return '<div class="soil"><span class="sd">' + s.from.toFixed(1) + '&ndash;' + s.to.toFixed(1) + '</span><span class="st2">' + esc(s.desc) + '</span></div>'; }).join('')
        : '<div class="empty">No soils logged yet.</div>';
      var spts = h.spts || [];
      document.getElementById('spt').innerHTML = spts.map(function(s){
        return '<div class="s"><div class="k">SPT ' + s.depth.toFixed(1) + ' m</div><div class="v">' + (s.n == null ? esc(s.blows) : 'N = ' + s.n) + '</div></div>';
      }).join('');

      // Runs
      var runs = h.runs || [];
      var rs = document.getElementById('runSt');
      if (runs.length){ rs.textContent = runs.length + ' runs'; rs.className = 'st'; }
      else { rs.textContent = 'None'; rs.className = 'st plan'; }
      document.getElementById('runBody').innerHTML = runs.length
        ? runs.map(function(r){
            var reopen = r.state === 'reopened';
            var chip = reopen ? '<span class="rst reopen">Reopened</span>' : '<span class="rst ok">Confirmed</span>';
            var cmt = r.comment ? '<span class="cmt">' + esc(r.comment) + '</span>' : '';
            return '<tr' + (reopen ? ' class="reopen"' : '') + '>' +
              '<td class="dp">' + esc(r.id) + '</td>' +
              '<td class="dp">' + r.from.toFixed(1) + '&ndash;' + r.to.toFixed(1) + '</td>' +
              '<td class="n">' + num(r.recovery_pct) + '</td>' +
              '<td class="n">' + num(r.rqd_pct) + '</td>' +
              '<td class="lith">' + esc(r.lithology) + cmt + '<br>' + chip + '</td>' +
            '</tr>';
          }).join('')
        : '<tr><td colspan="5"><div class="empty">Not yet cored.</div></td></tr>';

      // Water
      var water = h.water || [];
      document.getElementById('water').innerHTML = water.length
        ? water.map(function(w){ return '<div class="wl"><span class="wt">' + esc(w.type) + '</span><span class="wd">' + w.depth.toFixed(1) + ' m</span><span class="wn">' + esc(w.note) + '</span></div>'; }).join('')
        : '<div class="empty">No water observations yet.</div>';

      // Completion
      var c = h.completion;
      document.getElementById('comp').innerHTML = c
        ? [['Backfill', c.method], ['Reinstated', c.reinstated ? 'Yes · ' + esc(c.note) : 'No'], ['Backfilled', ago(c.backfilledDaysAgo)], ['Log', h.logReleased ? 'Released' : 'Draft']]
            .map(function(f){ return '<div class="cf"><div class="k">' + esc(f[0]) + '</div><div class="v">' + f[1] + '</div></div>'; }).join('')
        : '<div class="empty">' + esc(h.note || 'Not yet completed.') + '</div>';

      document.querySelectorAll('.pilesel .ps').forEach(function(el, i){ el.classList.toggle('sel', i === idx); });
    }
    renderSelector(document.getElementById('pilesel'), holes.map(function(h){
      return { primary: h.id, secondary: h.zone, cls: h.state === 'in_progress' ? 'fail' : null };
    }), { onSelect: render });
    render(0);
    var dock = document.getElementById('submitQA');
    dock.addEventListener('click', function(){
      dock.classList.add('done');
      document.getElementById('dockT').textContent = 'Log submitted';
      document.getElementById('dockS').textContent = 'Confirmed per run at QA';
      document.querySelector('.dock .bico').innerHTML = CHK;
    });
  }
  </script>

  <script defer src="../js/build.js"></script>
  <script defer src="../js/versioner.js"></script>
  <script defer src="../js/standalone.js"></script>
</body>
</html>
