*{box-sizing:border-box;margin:0;padding:0}
html,body{max-width:100%}

/* top bar */

.brand .tag{font-family:var(--mono);font-size:10px;letter-spacing:.22em;color:var(--sage);text-transform:uppercase}
.proj{display:flex;flex-direction:column;justify-content:center;z-index:1;min-width:0;margin-left:8px}
.proj .name{font-weight:700;font-size:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.proj .meta{font-size:12px;color:var(--sage)}
.topbar .right{margin-left:auto;display:flex;align-items:center;gap:22px;z-index:1;flex-shrink:0}
.sync{display:flex;align-items:center;gap:8px;font-size:12.5px;color:var(--sage)}
.sync .dot{width:7px;height:7px;border-radius:50%;background:#9fc27e;box-shadow:0 0 0 3px rgba(159,194,126,.18)}
.who{display:flex;align-items:center;gap:9px;font-size:13px}
.who .av{width:32px;height:32px;border-radius:50%;display:grid;place-items:center;background:var(--olive);color:var(--cream);font-family:var(--mono);font-size:11px;font-weight:700;border:1px solid rgba(243,239,230,.25)}

/* sub bar */
.subbar{background:var(--card);border-bottom:1px solid var(--line);display:flex;align-items:stretch;gap:6px;padding:0 24px;min-height:54px}
.tab{display:flex;align-items:center;padding:0 18px;font-size:15px;color:var(--ink-60);font-weight:500;border:none;background:none;border-bottom:2.5px solid transparent;cursor:pointer;white-space:nowrap;font-family:var(--ui)}

.subbar .right{margin-left:auto;display:flex;align-items:center}
.settings-link{display:flex;align-items:center;gap:7px;font-size:13px;color:var(--ink-60);background:none;border:none;cursor:pointer;font-family:var(--ui)}
.settings-link:hover{color:var(--forest)}

.content{padding:22px 24px 44px;display:flex;flex-direction:column;gap:18px;max-width:1440px;margin:0 auto;width:100%}

.setup-label{font-family:var(--mono);font-size:11px;letter-spacing:.13em;color:var(--ink-60);font-weight:700;border-left:3px solid var(--forest);padding-left:11px;white-space:nowrap;flex-shrink:0}
.steps{display:flex;align-items:center;gap:14px;flex:1}

.sstep .sn{width:26px;height:26px;border-radius:50%;border:1.5px solid var(--line-2);display:grid;place-items:center;font-family:var(--mono);font-size:12px;font-weight:700;color:var(--ink-40);flex-shrink:0}
.sstep.active{color:var(--ink);font-weight:600} .sstep.active .sn{background:var(--forest);border-color:var(--forest);color:var(--cream)}

.setup-bar .settings-link{margin-left:auto;display:flex;align-items:center;gap:7px;background:none;border:none;color:var(--ink-60);font-family:var(--ui);font-size:13.5px;cursor:pointer;white-space:nowrap}

.content2{padding:18px 24px 30px;max-width:1440px;margin:0 auto;width:100%}
.eq-head{display:flex;align-items:flex-start;gap:16px;flex-wrap:wrap;margin-bottom:16px}

.list-note{display:flex;align-items:flex-start;gap:8px;padding:0 4px;font-size:12px;color:var(--ink-40);line-height:1.5}

.libpanel{background:var(--card);border:1px solid var(--line);border-radius:13px;overflow:hidden}

.wmenu{color:var(--ink-40);display:flex;flex-shrink:0;margin-top:-1px}

.detailwrap{display:flex;flex-direction:column;gap:14px}
.d-head{display:flex;align-items:flex-start;justify-content:space-between;gap:14px;background:var(--card);border:1px solid var(--line);border-radius:13px;padding:18px 20px}
.d-code-row{display:flex;align-items:center;gap:11px}
.d-icon{display:flex;flex-shrink:0}
.d-code{font-family:var(--display);font-weight:700;font-size:22px;color:var(--ink);line-height:1.2}
.d-tags{display:flex;align-items:center;gap:9px;margin-top:11px}
.d-type{font-size:11.5px;font-weight:700;font-family:var(--mono);letter-spacing:.04em;color:var(--olive);background:#e7ebd9;border-radius:99px;padding:4px 11px}
.d-status{font-size:13px;color:var(--ink-60);margin-left:4px}
.d-acts{display:flex;gap:9px;flex-shrink:0}
.btn-o{display:flex;align-items:center;gap:7px;height:38px;padding:0 14px;border:1px solid var(--line-2);border-radius:8px;background:var(--card);color:var(--ink);font-family:var(--ui);font-size:13px;font-weight:600;cursor:pointer}
.btn-o:hover{border-color:var(--olive)} .btn-o.edit{background:var(--forest);color:var(--cream);border-color:var(--forest)} .btn-o.edit:hover{background:var(--forest-2)}

.gate{display:flex;align-items:flex-start;gap:13px;background:var(--sage-tint);border:1px solid #cdd5b9;border-radius:13px;padding:15px 18px}

.card{background:var(--card);border:1px solid var(--line);border-radius:13px;overflow:hidden}

.card-h .ch-ic{color:var(--olive)}
.req-spec{padding:16px 18px 6px;font-size:15px;color:var(--ink);font-weight:500;line-height:1.5}
.crit-rows{padding:0 18px 8px}
.crit2{display:flex;align-items:flex-start;justify-content:space-between;gap:16px;padding:11px 0;border-top:1px solid var(--line)}

.apc.k-work{color:var(--olive);background:#e7ebd9}
.apc.k-cond{color:var(--ochre);background:var(--ochre-tint);border:1px solid #eadbb8}

.reqcallout{display:flex;align-items:flex-start;gap:10px;margin:6px 16px 16px;padding:13px 15px;background:#eef3f8;border:1px solid #d6e2ee;border-radius:10px;font-size:13px;color:var(--ink-60);line-height:1.5}
.rc-ic{color:#2f6fb0;flex-shrink:0;margin-top:1px;display:flex}

.qa-summary{display:flex;align-items:center;gap:10px 20px;flex-wrap:wrap;background:var(--card);border:1px solid var(--line);border-radius:13px;padding:16px 20px;margin-top:16px}
.qs-label{font-family:var(--mono);font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-40);width:100%}
.qs-item{display:flex;align-items:center;gap:10px}
.qs-ic{width:32px;height:32px;border-radius:8px;display:grid;place-items:center;flex-shrink:0}
.qs-ic.ok{background:var(--sage-tint);color:var(--forest)} .qs-ic.cond{background:var(--ochre-tint);color:var(--ochre)} .qs-ic.blk{background:var(--forest);color:var(--cream)}
.qs-1{font-size:14px;font-weight:700;color:var(--ink)} .qs-2{font-size:12px;color:var(--ink-40);margin-top:1px}
.qs-result{margin-left:auto;max-width:330px} .qs-rk{font-size:11px;color:var(--ink-40)} .qs-rv{font-size:13px;font-weight:600;color:var(--forest);margin-top:2px;line-height:1.4}
.qs-preview{display:flex;align-items:center;gap:7px;height:40px;padding:0 16px;border:1px solid var(--line-2);border-radius:9px;background:var(--card);color:var(--ink);font-family:var(--ui);font-size:13px;font-weight:600;cursor:pointer;flex-shrink:0}

.docsheet>.d-head{border:none;border-radius:0;background:none;padding:18px 20px 15px}

.docsheet>.ds-governs .card-h{border-bottom:none;padding:14px 20px 2px}

.ss-sep{width:1px;height:18px;background:var(--line);margin:0 8px}
.continue-btn{margin-left:auto;display:flex;align-items:center;gap:9px;height:46px;padding:0 22px;border:none;border-radius:9px;background:var(--forest);color:var(--cream);font-family:var(--ui);font-size:14.5px;font-weight:600;cursor:pointer}
.continue-btn:hover{background:var(--forest-2)}
.eq-note{display:flex;align-items:center;gap:8px;margin-top:12px;font-size:12.5px;color:var(--ink-40)} .eq-note svg{color:var(--ink-40)}

@media (max-width:1000px){ body{overflow-x:hidden} .eq-grid{grid-template-columns:1fr} }

}

  import { packFor } from '../data/mock/index.js';
  import { activeProject } from '../config/projects.js';
  function esc(s){return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
  var AT='viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"';
  var OPEN="<svg width=\"16\" height=\"16\" viewBox=\"0 0 20 20\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.7\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M1.5 10S4.5 4.5 10 4.5 18.5 10 18.5 10 15.5 15.5 10 15.5 1.5 10 1.5 10z\"/><circle cx=\"10\" cy=\"10\" r=\"2.4\"/></svg>", REPLACE="<svg width=\"16\" height=\"16\" viewBox=\"0 0 20 20\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.7\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M3 7h11l-3-3M17 13H6l3 3\"/></svg>", MENU="<svg width=\"18\" height=\"18\" viewBox=\"0 0 20 20\" fill=\"none\"><circle cx=\"10\" cy=\"4.5\" r=\"1.3\" fill=\"currentColor\"/><circle cx=\"10\" cy=\"10\" r=\"1.3\" fill=\"currentColor\"/><circle cx=\"10\" cy=\"15.5\" r=\"1.3\" fill=\"currentColor\"/></svg>";
  function ic(inner,sz){return '<svg width="'+sz+'" height="'+sz+'" '+AT+'>'+inner+'</svg>';}
  var pack = packFor(activeProject().workType);
  if (pack && pack.safetyDocs) {
    var D = pack.safetyDocs;
    function btn(d,i){ return '<button class="wrow'+(i===0?' sel':'')+'" data-code="'+d.code+'"><span class="wsw" style="color:'+d.colour+'">'+ic(d.icon,18)+'</span><span class="wname2">'+esc(d.name)+'</span>'+(d.listBadge?'<span class="wbadge '+d.listBadge.cls+'">'+esc(d.listBadge.text)+'</span>':'')+'<span class="wmenu">'+MENU+'</span></button>'; }
    function sheet(d,i){
      var badge = d.badge?'<span class="wbadge '+d.badge.cls+'">'+esc(d.badge.text)+'</span>':'';
      var scope = d.scope.map(function(s){return '<div class="scope-col"><div class="sk">'+esc(s.sk)+'</div><span class="apc '+s.cls+'">'+esc(s.v)+'</span></div>';}).join('');
      var gate = d.gate.map(function(g){return '<div class="gate-line"><span class="gd '+g.state+'"></span><div>'+g.html+'</div></div>';}).join('');
      return '<div class="detail" id="d-'+d.code+'"'+(i===0?'':' style="display:none"')+' data-code="'+d.code+'"><div class="docsheet"><div class="d-head"><div class="d-head-l"><div class="d-code-row"><span class="d-icon" style="color:'+d.colour+'">'+ic(d.icon,22)+'</span><span class="d-code">'+esc(d.name)+'</span></div><div class="d-tags"><span class="d-type">'+esc(d.type)+'</span>'+badge+'<span class="d-status">'+esc(d.status)+'</span></div></div><div class="d-acts"><button class="btn-o">'+OPEN+' Open</button><button class="btn-o">'+REPLACE+' Replace</button></div></div><div class="srcmeta">'+esc(d.srcmeta)+'</div><div class="ds-governs"><div class="card-h">Governs <button class="edit">Edit scope</button></div><div class="cbody"><div class="scope-grid">'+scope+'</div></div></div></div><div class="card"><div class="card-h">Sign-on gate</div><div class="cbody">'+gate+'</div></div></div>'; }
    document.getElementById('srList').innerHTML = D.map(btn).join('');
    document.getElementById('srDetails').innerHTML = D.map(sheet).join('');
    var c=document.getElementById('srCount'); if(c) c.textContent='· '+D.length;
    var ft=document.getElementById('srFoot'); if(ft) ft.textContent=pack.safetyFoot;
    function show(c){document.querySelectorAll('.detail').forEach(function(x){x.style.display=(x.dataset.code===c)?'block':'none';});document.querySelectorAll('.wrow').forEach(function(r){r.classList.toggle('sel',r.dataset.code===c);});}
    document.querySelectorAll('.wrow').forEach(function(r){r.addEventListener('click',function(){show(r.dataset.code);});});
  }
  </script>

  <script defer src="../js/build.js"></script>
  <script defer src="../js/versioner.js"></script>
  <script defer src="../js/standalone.js"></script>
</body></html>
