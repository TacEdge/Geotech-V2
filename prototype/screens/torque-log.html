<!DOCTYPE html>
<html lang="en-NZ">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TacEdge Geotech · Install / Torque Log</title>
  <link rel="stylesheet" href="../styles/fonts.css">
  <link rel="stylesheet" href="../styles/tokens.css">
  <link rel="stylesheet" href="../styles/base.css">
  <link rel="stylesheet" href="../styles/components.css">
<style>

*{box-sizing:border-box;margin:0;padding:0}
body{font-family:var(--ui);color:var(--ink);background:var(--cream);min-height:100vh;-webkit-font-smoothing:antialiased}

.signed{display:flex;align-items:center;gap:9px;background:var(--sage-tint);color:var(--forest-2);
  font-size:12.5px;padding:9px 16px;border-bottom:1px solid #cdd5b9}
.signed .tick{width:17px;height:17px;border-radius:50%;background:var(--forest);color:var(--cream);display:grid;place-items:center;flex-shrink:0}
.signed b{font-weight:700}
.signed .jsa{margin-left:auto;font-family:var(--mono);font-size:10px;font-weight:700;letter-spacing:.1em;color:var(--forest);background:var(--card);border:1px solid #cdd5b9;border-radius:var(--r-pill);padding:3px 9px}

.wrap{max-width:560px;margin:0 auto;padding:16px 16px 120px}
.phead h1{font-size:22px;font-weight:700;color:var(--ink);line-height:1.15}
.phead .psub{font-size:13px;color:var(--ink-60);margin-top:4px}

.pilesel{display:flex;gap:8px;margin-top:14px;overflow-x:auto;padding-bottom:2px}
.pilesel .ps{flex-shrink:0;display:flex;flex-direction:column;gap:2px;align-items:flex-start;
  background:var(--card);border:1.5px solid var(--line-2);border-radius:var(--r-md);
  padding:9px 14px;cursor:pointer;font-family:var(--ui)}
.pilesel .ps .pn{font-family:var(--mono);font-size:14px;font-weight:700;color:var(--ink)}
.pilesel .ps .pz{font-size:11px;color:var(--ink-40)}
.pilesel .ps.sel{border-color:var(--forest);background:var(--sage-tint)}
.pilesel .ps.sel .pn{color:var(--forest)}

.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r-lg);box-shadow:var(--shadow-sm);padding:16px;margin-top:14px}
.card .clab{font-family:var(--mono);font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-40);margin-bottom:12px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.card .clab .thr{margin-left:auto;text-transform:none;letter-spacing:0;font-family:var(--ui);font-size:11.5px;font-weight:600;color:var(--forest-2);background:var(--sage-tint);border-radius:var(--r-pill);padding:3px 10px}

.idrow{display:flex;align-items:flex-end;justify-content:space-between;gap:14px}
.idrow .pid{font-family:var(--mono);font-size:32px;font-weight:700;color:var(--forest);line-height:1}
.idrow .pst{font-family:var(--mono);font-size:11px;font-weight:600;color:var(--forest-2);background:var(--sage-tint);border-radius:var(--r-pill);padding:5px 11px}
.meta{display:grid;grid-template-columns:1fr 1fr;gap:10px 14px;margin-top:16px}
.meta .m .k{font-size:11px;color:var(--ink-40)}
.meta .m .v{font-size:14px;font-weight:600;color:var(--ink);margin-top:2px}

table.tq{width:100%;border-collapse:collapse}
table.tq th{font-family:var(--mono);font-size:10px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-40);text-align:right;font-weight:600;padding:8px 6px;border-bottom:1px solid var(--line)}
table.tq th:first-child{text-align:left}
table.tq td{font-family:var(--mono);font-size:14px;color:var(--ink);text-align:right;padding:10px 6px;border-bottom:1px solid var(--line)}
table.tq td:first-child{text-align:left;color:var(--ink-60)}
table.tq tr:last-child td{border-bottom:none}
table.tq tr.pass td{background:var(--sage-tint)}
table.tq tr.pass td.rz{color:var(--forest-2);font-weight:700}

.sum{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px}
.sum .s{background:var(--plan);border:1px solid var(--line);border-radius:var(--r-md);padding:12px}
.sum .s .k{font-size:11px;color:var(--ink-40)}
.sum .s .v{font-family:var(--mono);font-size:18px;font-weight:700;color:var(--ink);margin-top:5px}
.sum .s .v.ok{color:var(--forest-2)}

.rules{list-style:none;display:flex;flex-direction:column;gap:9px}
.rules li{display:flex;align-items:flex-start;gap:10px;font-size:13.5px;color:var(--ink)}
.rules li .rc{width:18px;height:18px;border-radius:50%;background:var(--sage-tint);color:var(--forest);display:grid;place-items:center;flex-shrink:0;margin-top:1px}
.rules li .rc svg{width:11px;height:11px}

.photos{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.ph{aspect-ratio:4/3;border:1.5px dashed var(--line-2);border-radius:var(--r-md);background:var(--plan);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:7px;color:var(--ink-40)}
.ph svg{width:24px;height:24px}
.ph span{font-size:11.5px;font-weight:600}

.dock{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--line);
  padding:12px 16px calc(12px + env(safe-area-inset-bottom));box-shadow:0 -4px 18px rgba(43,71,33,.06)}
.dock .btn{width:100%;max-width:560px;margin:0 auto;display:flex;align-items:center;gap:12px;
  background:var(--forest);color:var(--cream);border:none;border-radius:var(--r-md);
  padding:14px 18px;cursor:pointer;font-family:var(--ui)}
.dock .btn:hover{background:var(--forest-2)}
.dock .btn .bico{flex-shrink:0}
.dock .btn .bt{display:flex;flex-direction:column;align-items:flex-start;text-align:left;flex:1}
.dock .btn .bt1{font-size:15px;font-weight:600}
.dock .btn .bt2{font-size:12px;color:var(--sage)}
.dock .btn.done{background:var(--sage-tint);color:var(--forest-2)}
.dock .btn.done .bt2{color:var(--forest)}
</style>
<link rel="manifest" href="../manifest.json">
<meta name="theme-color" content="#2b4721">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="TacEdge">
<link rel="apple-touch-icon" href="../assets/icons/apple-touch-icon.png?v=2026-06-26.7">
  <script src="../config/screens.js"></script>
  <script src="../components/header.js"></script>
</head>
<body class="field">
  <header></header>
  <script>TE_HEADER.fill('torque-log')</script>

  <div class="signed">
    <span class="tick"><svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6L9 17l-5-5"/></svg></span>
    <span>Signed on <b>06:51</b> &middot; cleared to install</span><span class="jsa">JSA-204 ACK</span>
  </div>

  <main class="wrap">
    <div class="phead">
      <h1>Install / Torque Log</h1>
      <div class="psub" id="psub">Screw pile</div>
    </div>

    <div class="pilesel" id="pilesel"></div>

    <div class="card">
      <div class="idrow">
        <div class="pid" id="pid">—</div>
        <div class="pst" id="pst">—</div>
      </div>
      <div class="meta" id="meta"></div>
    </div>

    <div class="card">
      <div class="clab">Torque vs depth <span class="thr" id="thr"></span></div>
      <table class="tq">
        <thead><tr><th>Depth</th><th>Torque</th><th>Reading</th></tr></thead>
        <tbody id="tqbody"></tbody>
      </table>
    </div>

    <div class="card">
      <div class="clab">Result</div>
      <div class="sum" id="sum"></div>
    </div>

    <div class="card">
      <div class="clab">Acceptance criteria</div>
      <ul class="rules" id="rules"></ul>
    </div>

    <div class="card">
      <div class="clab">Photos</div>
      <div class="photos">
        <div class="ph"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="6" width="18" height="14" rx="2"/><circle cx="12" cy="13" r="3.5"/><path d="M8 6l1.5-2h5L16 6"/></svg><span>Founding</span></div>
        <div class="ph"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="6" width="18" height="14" rx="2"/><circle cx="12" cy="13" r="3.5"/><path d="M8 6l1.5-2h5L16 6"/></svg><span>Cut-off</span></div>
      </div>
    </div>
  </main>

  <div class="dock">
    <button class="btn" id="submitQA">
      <svg class="bico" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round"><path d="M22 2L11 13M22 2l-7 20-4-9-9-4 20-7z"/></svg>
      <span class="bt"><span class="bt1" id="dockT">Submit for QA</span><span class="bt2" id="dockS">Founding torque and photos recorded</span></span>
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18l6-6-6-6"/></svg>
    </button>
  </div>

  <script type="module">
  import { packFor } from '../data/mock/index.js';
  import { WORK_TYPES } from '../config/workTypes.js';
  function esc(s){return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
  var CHK='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6L9 17l-5-5"/></svg>';
  var pack = packFor('piling');
  var wt = WORK_TYPES.piling;
  if (pack && pack.torqueLogs && pack.torqueLogs.length) {
    var logs = pack.torqueLogs;
    // Threshold values from the typed torque rule (config), not hard-coded here.
    var tRule = (wt.rules || []).filter(function(r){return r.field==='torque';})[0] || { value: 8, unit: 'kNm', qualifier: { value: 4.0, unit: 'm' } };
    var targetTorque = tRule.value, minDepth = (tRule.qualifier && tRule.qualifier.value) || 4.0;
    document.getElementById('thr').textContent = 'Target ' + targetTorque + ' ' + tRule.unit + ' at ≥ ' + minDepth.toFixed(1) + ' m';
    document.getElementById('rules').innerHTML = (wt.rules || []).map(function(r){
      return '<li><span class="rc">' + CHK + '</span><span>' + esc(r.label) + '</span></li>';
    }).join('');

    function metRow(series){
      for (var i = 0; i < series.length; i++){
        if (series[i].torque >= targetTorque && series[i].depth >= minDepth) return i;
      }
      return -1;
    }
    function render(idx){
      var r = logs[idx];
      document.getElementById('psub').textContent = 'Screw pile · ' + r.template;
      document.getElementById('pid').textContent = r.pile;
      document.getElementById('pst').textContent = r.result === 'Pass' ? 'Founded' : 'In progress';
      document.getElementById('meta').innerHTML =
        '<div class="m"><div class="k">Date</div><div class="v">' + esc(r.date) + '</div></div>' +
        '<div class="m"><div class="k">Crew</div><div class="v">' + esc(r.crew) + '</div></div>' +
        '<div class="m"><div class="k">Rig</div><div class="v">' + esc(r.rig) + '</div></div>' +
        '<div class="m"><div class="k">Zone</div><div class="v">' + esc(r.zone) + '</div></div>';
      var met = metRow(r.series);
      document.getElementById('tqbody').innerHTML = r.series.map(function(row, i){
        var reading = i < met || met < 0 ? 'Advancing' : (i === met ? 'Target met' : 'Sustained');
        return '<tr' + (i === met ? ' class="pass"' : '') + '><td>' + row.depth.toFixed(1) + ' m</td><td>' +
          row.torque.toFixed(1) + ' kNm</td><td class="rz">' + reading + '</td></tr>';
      }).join('');
      document.getElementById('sum').innerHTML =
        '<div class="s"><div class="k">Final torque</div><div class="v ok">' + esc(r.finalTorque) + '</div></div>' +
        '<div class="s"><div class="k">Final depth</div><div class="v">' + esc(r.finalDepth) + '</div></div>' +
        '<div class="s"><div class="k">Sustained from</div><div class="v">' + esc(r.sustainedFrom) + '</div></div>';
      document.querySelectorAll('.pilesel .ps').forEach(function(el, i){ el.classList.toggle('sel', i === idx); });
    }

    document.getElementById('pilesel').innerHTML = logs.map(function(r, i){
      return '<button class="ps' + (i === 0 ? ' sel' : '') + '" data-i="' + i + '"><span class="pn">' + esc(r.pile) + '</span><span class="pz">' + esc(r.zone) + '</span></button>';
    }).join('');
    document.querySelectorAll('.pilesel .ps').forEach(function(el){
      el.addEventListener('click', function(){ render(+el.dataset.i); });
    });
    render(0);

    var dock = document.getElementById('submitQA');
    dock.addEventListener('click', function(){
      dock.classList.add('done');
      document.getElementById('dockT').textContent = 'Submitted for QA';
      document.getElementById('dockS').textContent = 'PM will confirm against the acceptance criteria';
      document.querySelector('.dock .bico').innerHTML = CHK;
    });
  }
  </script>

  <script defer src="../js/build.js"></script>
  <script defer src="../js/versioner.js"></script>
  <script defer src="../js/standalone.js"></script>
</body>
</html>
