<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 853" role="img" aria-label="Slip Site Investigation site plan (placeholder artwork)">
  <!-- PLACEHOLDER site plan · Slip Site Investigation · replace with survey.
       Two investigation zones (Upper Slip, Lower Terrace) separated by a slip
       scarp line. Borehole positions are indicative only. -->
  <defs>
    <linearGradient id="ss-upper" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#cdd3c0"/>
      <stop offset="1" stop-color="#b8c0a6"/>
    </linearGradient>
    <linearGradient id="ss-lower" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#c3bfa6"/>
      <stop offset="1" stop-color="#aca88c"/>
    </linearGradient>
  </defs>

  <rect x="0" y="0" width="1280" height="853" fill="#d9d2bf"/>

  <!-- Upper Slip zone -->
  <rect x="0" y="0" width="1280" height="470" fill="url(#ss-upper)"/>
  <g stroke="#9aa383" stroke-width="1.2" opacity="0.45">
    <path d="M0 150 C 320 130, 720 175, 1280 140"/>
    <path d="M0 250 C 300 235, 760 275, 1280 245"/>
    <path d="M0 350 C 340 330, 700 372, 1280 345"/>
  </g>
  <text x="30" y="60" font-family="'JetBrains Mono', ui-monospace, monospace" font-weight="700" font-size="22" letter-spacing="3" fill="#55603f">UPPER SLIP</text>

  <!-- Slip scarp line -->
  <path d="M0 470 C 260 430, 520 500, 780 455 C 1000 418, 1140 495, 1280 460" fill="none" stroke="#7a5c3a" stroke-width="4" stroke-dasharray="2 0"/>
  <path d="M0 470 C 260 430, 520 500, 780 455 C 1000 418, 1140 495, 1280 460" fill="none" stroke="#93704a" stroke-width="10" opacity="0.25"/>
  <text x="30" y="500" font-family="'JetBrains Mono', ui-monospace, monospace" font-weight="700" font-size="15" letter-spacing="2" fill="#7a5c3a">SLIP SCARP</text>

  <!-- Lower Terrace zone -->
  <rect x="0" y="505" width="1280" height="348" fill="url(#ss-lower)"/>
  <g stroke="#8b8468" stroke-width="1.2" opacity="0.4">
    <path d="M0 600 C 320 585, 720 625, 1280 595"/>
    <path d="M0 700 C 300 685, 760 725, 1280 700"/>
  </g>
  <text x="30" y="560" font-family="'JetBrains Mono', ui-monospace, monospace" font-weight="700" font-size="22" letter-spacing="3" fill="#4f4931">LOWER TERRACE</text>

  <text x="1140" y="832" font-family="'JetBrains Mono', ui-monospace, monospace" font-weight="700" font-size="16" letter-spacing="2" fill="#8a7c55" opacity="0.8">PLACEHOLDER</text>
</svg>
